# Copy to config.toml and edit. config.toml is gitignored.
#
# Keep `root` SHORT. Mod trees are deep and version directories add segments; a long
# root will blow past Windows MAX_PATH (260) at runtime. `D:\dz`, not
# `C:\Users\you\Documents\DayZ Server Manager`. Config load validates this and fails.
root = 'D:\dz'

# Old versions are kept indefinitely unless you opt in here. Uncomment to have versions
# that are unused, not the newest for their mod, and older than N days pruned after
# `dzsm mods update`. `dzsm mods versions` lists what is cached; `dzsm mods delete <mod>
# <version>` removes one explicitly; `dzsm mods prune` applies the policy on demand.
# gc_retention_days = 7
# "copy" is the only trusted strategy. "hardlink" is an untested optimization (spec §12)
# that silently corrupts old versions if steamcmd writes files in place.
snapshot_strategy = "copy"

# Each instance gets its own mission directory (<instance>.<terrain>), seeded once from a
# vanilla one. On by default: mission folders hold types.xml, events.xml, init.c AND the
# persistence storage, so instances sharing one clobber each other's economy and saves.
per_instance_missions = true

[rcon]
# BattlEye RCON, used for restart warnings and admin chat. An instance takes part only
# when it sets rcon_port — dzsm will not guess a port.
host = "127.0.0.1"
# The password is read from this env var, never from config. It must match RConPassword
# in the server's BEServer config (under <profiles>/BattlEye/).
password_env = "DZSM_RCON_PASSWORD"
# Warnings come in two tiers: every 5 minutes from 30 minutes out, then every 4 seconds
# for the last 5 minutes.
early_warning_lead_seconds = 1800
early_warning_interval_seconds = 300
final_warning_lead_seconds = 300
final_warning_interval_seconds = 4
# Stop servers with RCON's #shutdown so DayZ flushes persistence on its own shutdown
# path. Falls back to terminate, then kill, if it does not exit.
shutdown_via_rcon = true
# {remaining} becomes "5 minutes", "1 minute", "20 seconds".
warning_message = "Server restart in {remaining}"

[steam]
username = "your_steam_account"
# The password is read from this environment variable, never from this file.
# Seed Steam Guard once interactively; steamcmd caches a sentry afterward.
password_env = "DZSM_STEAM_PASSWORD"
# steamcmd is downloaded from Valve automatically if it isn't here already.
steamcmd_path = 'D:\dz\steamcmd\steamcmd.exe'
# Set false to refuse to fetch an executable at runtime; dzsm then fails with
# instructions instead of installing it.
# auto_install = true

# ---------------------------------------------------------------------------
# Mods. The table key is the name instances refer to.
# ---------------------------------------------------------------------------

[mods.CF]
kind = "workshop"
workshop_id = 1559212036

[mods.Expansion]
kind = "workshop"
workshop_id = 2116157322

[mods.MyTestMod]
kind = "local"
path = 'D:\dz\localmods\@MyTestMod'

# ---------------------------------------------------------------------------
# Instances.
# ---------------------------------------------------------------------------

[instances.chernarus]
port = 2302
# ORDER IS LOAD ORDER. It is the semicolon order in -mod=. Framework mods
# (CF and friends) must come before anything that depends on them. This list is the
# only source of load order — never sorted, never derived from the [mods] table order.
mods = ["CF", "Expansion"]
# Server-only mods, emitted as -serverMod=. Clients never load these, so admin tools and
# server-side logic belong here. Same ordering rule. A mod goes in one list or the
# other — never both.
server_mods = []
# Temporarily disabled but retained. A mod here is not launched, is not reported as
# unused, and cannot be deleted without --force — so its cache survives and re-enabling
# it is moving the name back to `mods`, not re-downloading several GB.
keep_mods = []
# BattlEye RCON port, from this server's BEServer config (RConPort). Without it the
# instance gets no restart warnings and no admin chat.
# rcon_port = 2306
# Env var for this instance's RCON password, if it differs from the global one.
# rcon_password_env = "DZSM_RCON_PASSWORD_CHERNARUS"
# Mission directory for this instance. Omit to derive "<instance>.<terrain>".
# mission = "pvp.chernarusplus"
# What to seed it from, by name under the server's mpmissions/. Omit to use whatever the
# server installation's serverDZ.cfg names. Set it to run a different map per instance.
# mission_source = "dayzOffline.sakhal"
# Pin to a specific downloaded build (see `dzsm server list`). Omit for the newest.
# Use it to hold production on a known-good build while a test instance runs a newer one.
# server_build = "24041098"
# Give this instance its own full copy of the server app under instances/<name>/server/.
# Costs a few GB and buys complete isolation: its own keys/, its own mission files, no
# shared state with any other instance.
isolated_server = false
restart_schedule = ["04:00", "10:00", "16:00", "22:00"]
# Also restart this many hours after the instance starts, independently of the schedule
# above — whichever comes first wins. Defaults to 4. Set to nothing to disable.
restart_after_hours = 4

[instances.testing]
port = 2402
mods = ["CF", "MyTestMod"]
restart_schedule = ["05:00", "17:00"]

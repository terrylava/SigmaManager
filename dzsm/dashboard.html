<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dzsm</title>
<style>
 body { font: 14px system-ui, sans-serif; margin: 2rem; background: #111; color: #ddd }
 h1 { font-size: 1.2rem; margin: 0 0 1.5rem; display: flex; gap: 1rem; align-items: baseline;
      flex-wrap: wrap }
 h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .05em;
      color: #888; margin: 2rem 0 .5rem }
 table { border-collapse: collapse; width: 100% }
 td, th { text-align: left; padding: .45rem .8rem .45rem 0; border-bottom: 1px solid #262626;
          vertical-align: top }
 th { color: #888; font-weight: 500 }
 .run { color: #4ade80 } .stop { color: #777 } .warn { color: #fbbf24 }
 .held { color: #22d3ee } .err { color: #f87171 }
 code { color: #93c5fd }
 a { color: #93c5fd; text-decoration: none }
 a:hover { text-decoration: underline }
 nav { display: flex; gap: 1rem; font-size: .9rem }
 nav a { color: #888; padding-bottom: .1rem; border-bottom: 2px solid transparent }
 nav a.on { color: #ddd; border-bottom-color: #2f6f4f }
 .note { color: #666; font-size: .85rem }
 p.note { margin-top: 2rem }
 button { font: inherit; background: #1e1e1e; color: #ddd; border: 1px solid #3a3a3a;
          border-radius: 4px; padding: .25rem .7rem; cursor: pointer; margin-right: .3rem }
 button:hover:not(:disabled) { background: #2a2a2a; border-color: #555 }
 button:disabled { opacity: .4; cursor: default }
 button.primary { border-color: #2f6f4f; color: #4ade80 }
 button.danger { border-color: #6f2f2f; color: #f87171 }
 #msg { margin: 1rem 0; padding: .6rem .8rem; border-radius: 4px; display: none }
 #msg.show { display: block }
 #msg.ok { background: #16281c; color: #4ade80 }
 #msg.bad { background: #2a1616; color: #f87171 }
 #jobs { margin: 1rem 0 }
 .job { padding: .4rem 0; color: #aaa }
 .spin { display: inline-block; animation: spin 1s linear infinite }
 @keyframes spin { to { transform: rotate(360deg) } }
 #token { font: inherit; background: #1a1a1a; color: #ddd; border: 1px solid #333;
          border-radius: 4px; padding: .2rem .5rem; width: 14rem }
 .bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap }
 .panel { border: 1px solid #2c2c2c; border-radius: 6px; padding: 1rem; margin: .5rem 0 1.5rem;
          background: #161616 }
 .panel h3 { margin: 0 0 .8rem; font-size: .9rem; color: #bbb }
 .field { display: flex; gap: .6rem; align-items: center; margin-bottom: .6rem; flex-wrap: wrap }
 .field > label:first-child { width: 12rem; color: #888; flex: none }
 .cores { display: flex; flex-wrap: wrap; gap: .35rem; max-width: 40rem }
 .cores label { border: 1px solid #333; border-radius: 4px; padding: .1rem .45rem;
                cursor: pointer; user-select: none; font-variant-numeric: tabular-nums }
 /* :has() keeps the tick state purely declarative — the alternative was an inline
    onchange on every core, which is exactly the pattern this file no longer uses. */
 .cores label:has(input:checked) { border-color: #2f6f4f; color: #4ade80; background: #16281c }
 /* Hidden visually but still focusable and still in the accessibility tree.
    display:none would drop it out of the tab order entirely. */
 .cores input { position: absolute; opacity: 0; width: 1px; height: 1px }
 .cores label:focus-within { outline: 2px solid #4ade80; outline-offset: 1px }
 select, input[type=number], input[type=text] {
   font: inherit; background: #1a1a1a; color: #ddd; border: 1px solid #333;
   border-radius: 4px; padding: .2rem .4rem }
 textarea { font: 12px ui-monospace, Consolas, monospace; width: 100%; min-height: 22rem;
            background: #0d0d0d; color: #ddd; border: 1px solid #333; border-radius: 4px;
            padding: .6rem }
 .flags label { margin-right: 1rem; color: #ccc }
 .hit { display: flex; gap: .8rem; padding: .7rem 0; border-bottom: 1px solid #222 }
 .hit img { width: 96px; height: 54px; object-fit: cover; border-radius: 4px;
            background: #222; flex: none }
 .hit .body { flex: 1; min-width: 0 }
 .hit .title { font-weight: 600 }
 .hit .desc { color: #888; font-size: .85rem; margin: .2rem 0;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden }
 .hit .meta { color: #666; font-size: .8rem }
 .hit .act { flex: none; text-align: right }
 .targets label { display: block; color: #ccc; font-size: .85rem }
 .head { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; margin-bottom: 1rem }
 .head h2 { margin: 0; font-size: 1.1rem; text-transform: none; letter-spacing: 0; color: #ddd }
</style>
</head>
<body>
<h1>dzsm
  <nav id="nav"></nav>
  <span class="note" id="root"></span>
</h1>

<div id="msg"></div>
<div id="jobs"></div>
<div id="c">loading&hellip;</div>

<p class="note" id="foot"></p>

<script>
// Every dynamic value below is interpolated into a data-* attribute and read back through
// element.dataset, never into inline handler source. Building `onclick="f(' + value + ')"`
// is what broke the mod buttons: JSON.stringify emits double quotes, which terminate the
// attribute early and leave a syntax error the browser reports nowhere. Delegation makes
// that class of bug impossible — esc() covers the quote, and the value never becomes code.
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mib = b => (b / 1048576).toFixed(1) + ' MiB';
const age = d => d == null ? '?' : d.toFixed(1) + 'd';
const attr = (name, value) => ' ' + name + '="' + esc(value) + '"';

let busy = false;
let jobs = [];
let last = {instances: [], versions: [], server: {builds: []}, mods: [], global: null,
            updates: null};

function token() { return sessionStorage.getItem('dzsm-token') || ''; }
function headers() { const t = token(); return t ? {'X-DZSM-Token': t} : {}; }

function say(text, bad) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'show ' + (bad ? 'bad' : 'ok');
  if (!bad) setTimeout(() => { el.className = ''; }, 4000);
}

async function post(path, label) {
  if (busy) return;
  busy = true;
  render();
  try {
    const r = await fetch(path, {method: 'POST', headers: headers()});
    const body = await r.json().catch(() => ({}));
    if (!r.ok) say(body.detail || (label + ' failed (' + r.status + ')'), true);
    else if (body.id) say(label + ' started');       // 202 with a job id
    else say(label + ' done');
  } catch (e) {
    say(label + ' failed: ' + e, true);
  } finally {
    busy = false; painted = ''; load();
  }
}

async function send(method, path, body, label) {
  if (busy) return false;
  busy = true;
  render();
  try {
    const r = await fetch(path, {
      method: method,
      headers: Object.assign({'Content-Type': 'application/json'}, headers()),
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) { say(out.detail || (label + ' failed (' + r.status + ')'), true); return false; }
    // The label is the whole sentence, not a subject the caller appends "saved" to: a
    // removal reported as "Expansion removed from chernarus saved" reads like a bug.
    const pending = out.applies_at_next_start;
    const later = Array.isArray(pending) ? pending.length : !!pending;
    say(label + (later ? ' - applies at the next start' : ''));
    return out;
  } catch (e) {
    say(label + ' failed: ' + e, true);
    return false;
  } finally {
    busy = false; dirty = false; painted = ''; load();
  }
}

// --- routing -------------------------------------------------------------------
// Hash routing rather than paths: the dashboard is one static file served at /, so a
// real path would 404 on reload.

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h.startsWith('/server/')) return {page: 'server', name: h.slice('/server/'.length)};
  if (h === '/mods') return {page: 'mods'};
  return {page: 'overview'};
}

window.addEventListener('hashchange', () => {
  cfgEditing = null; assigning = null; dirty = false; painted = ''; render();
});

function navBar(view) {
  const link = (href, label, on) =>
    '<a href="' + href + '"' + (on ? ' class="on"' : '') + '>' + label + '</a>';
  return link('#/', 'Overview', view.page === 'overview')
       + link('#/mods', 'Mods', view.page === 'mods')
       + (view.page === 'server'
          ? '<a href="#/server/' + encodeURIComponent(view.name) + '" class="on">'
            + esc(view.name) + '</a>'
          : '');
}

// --- event delegation ----------------------------------------------------------

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) { say('no such action: ' + el.dataset.act, true); return; }
  e.preventDefault();
  fn(el.dataset, el);
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const fn = actions[el.dataset.change];
  if (fn) fn(el.dataset, el);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target.closest('[data-enter]');
  if (!el) return;
  const fn = actions[el.dataset.enter];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});

// A form panel with unsaved edits must never be repainted out from under the person
// typing in it. Scoped to [data-form] so search boxes and the token field, which are
// preserved separately, do not freeze the page's live updates.
let dirty = false;
document.addEventListener('input', e => {
  if (e.target.closest('[data-form]')) dirty = true;
});

const val = id => {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
};
const num = id => { const v = val(id); return v === '' ? null : +v; };
const checked = id => {
  const el = document.getElementById(id);
  return el ? el.checked : false;
};
const ticked = sel => [...document.querySelectorAll(sel + ' input:checked')].map(e => e.value);

// --- actions -------------------------------------------------------------------

const actions = {
  start: d => post('api/instances/' + encodeURIComponent(d.name) + '/start', 'Start ' + d.name),
  stop: d => post('api/instances/' + encodeURIComponent(d.name) + '/stop', 'Stop ' + d.name),
  restart: d => post('api/instances/' + encodeURIComponent(d.name) + '/restart',
                     'Restart ' + d.name),
  modsCheck: () => post('api/mods/check', 'Check for mod updates'),
  modsUpdate: () => post('api/mods/update', 'Mod update'),
  serverUpdate: () => post('api/server/update', 'Server app update'),

  // --- manager settings (overview) ---

  saveGlobal: async () => {
    const current = last.global.values;
    const patch = {};
    for (const f of GLOBAL_FIELDS) {
      const id = 'g-' + f.k.replace(/\./g, '-');
      const v = f.t === 'bool' ? checked(id)
              : f.t === 'num' ? num(id)
              : (val(id) || null);
      // Only what actually changed. Sending every field would write each one explicitly,
      // turning fifteen defaults into fifteen frozen settings — a later change to a
      // default would then never reach a config whose owner once clicked Save.
      if (v !== (current[f.k] === undefined ? null : current[f.k])) patch[f.k] = v;
    }
    if (!Object.keys(patch).length) { say('Manager settings unchanged'); return; }
    await send('PATCH', 'api/config/global', patch, 'Manager settings saved');
  },

  // --- one server ---

  saveLaunch: async d => {
    const cores = ticked('.cores');
    const patch = {
      // null removes the key and restores the default, which is what "all cores" and
      // "leave the priority alone" actually mean.
      cpu_affinity: cores.length ? cores.map(Number) : null,
      priority: val('f-priority') || null,
      cpu_count: num('f-cpucount'),
      restart_after_hours: num('f-hours'),
      server_executable: val('f-exe') || null,
      dologs: checked('f-dologs'),
      adminlog: checked('f-adminlog'),
      netlog: checked('f-netlog'),
      freezecheck: checked('f-freezecheck'),
    };
    await send('PATCH', 'api/instances/' + encodeURIComponent(d.name) + '/settings',
               patch, 'Settings for ' + d.name + ' saved');
  },

  editCfg: async d => {
    if (cfgEditing === d.name) { cfgEditing = null; painted = ''; render(); return; }
    try {
      const r = await fetch('api/instances/' + encodeURIComponent(d.name) + '/serverdz');
      const out = await r.json();
      if (!r.ok) { say(out.detail || 'could not read serverDZ.cfg', true); return; }
      cfgEditing = d.name; painted = ''; render();
      document.getElementById('cfgtext').value = out.text;
      document.getElementById('cfgpath').textContent = out.path;
    } catch (e) { say('could not read serverDZ.cfg: ' + e, true); }
  },

  saveCfg: async d => {
    const text = document.getElementById('cfgtext').value;
    if (await send('PUT', 'api/instances/' + encodeURIComponent(d.name) + '/serverdz',
                   {text: text}, 'serverDZ.cfg for ' + d.name + ' saved')) {
      cfgEditing = null;
    }
  },

  // --- a server's mods ---

  instAddMod: async d => {
    const mod = val('add-mod');
    if (!mod) { say('pick a mod to add', true); return; }
    await send('PUT', 'api/instances/' + encodeURIComponent(d.name) + '/mods/'
               + encodeURIComponent(mod), {list_name: val('add-list') || 'mods'},
               'Added ' + mod + ' to ' + d.name);
  },

  instSetList: async (d, el) => {
    await send('PUT', 'api/instances/' + encodeURIComponent(d.name) + '/mods/'
               + encodeURIComponent(d.mod), {list_name: el.value},
               d.mod + ' on ' + d.name + ' is now ' + LIST_LABELS[el.value]);
  },

  instRemoveMod: async d => {
    if (!confirm('Remove "' + d.mod + '" from ' + d.name + '?\n\nIt stays configured and '
                 + 'stays downloaded — this only takes it out of this server.')) return;
    await send('DELETE', 'api/instances/' + encodeURIComponent(d.name) + '/mods/'
               + encodeURIComponent(d.mod), undefined, 'Removed ' + d.mod + ' from ' + d.name);
  },

  instLocalize: async d => {
    const suggested = d.mod + '_' + d.name;
    const name = prompt(
      'Copy "' + d.mod + '" into localmods/ and switch ' + d.name + ' over to the copy?\n\n'
      + 'The copy is never updated by Steam, so it is yours to edit. Other servers keep '
      + 'using the original.\n\nName for the copy:', suggested);
    if (!name) return;
    const out = await send('POST', 'api/instances/' + encodeURIComponent(d.name) + '/mods/'
                           + encodeURIComponent(d.mod) + '/localize', {name: name},
                           'Local copy of ' + d.mod + ' made');
    if (out) say('Copied ' + d.mod + ' to ' + out.path
                 + (out.copied_version ? ' (from version ' + out.copied_version + ')' : ''));
  },

  // --- all mods ---

  assign: d => { assigning = (assigning === d.mod ? null : d.mod); painted = ''; render(); },

  saveAssign: async d => {
    if (await send('PATCH', 'api/config/mods/' + encodeURIComponent(d.mod) + '/instances',
                   {instances: ticked('.atargets'), list_name: val('a-list')},
                   'Assignment for ' + d.mod + ' saved')) {
      assigning = null;
    }
  },

  localizeMod: async d => {
    const name = prompt(
      'Make an editable local copy of "' + d.mod + '"?\n\nIt is added as a separate mod, '
      + 'not attached to any server — assign it afterwards.\n\nName for the copy:',
      d.mod + '_copy');
    if (!name) return;
    const out = await send('POST', 'api/config/mods/' + encodeURIComponent(d.mod) + '/localize',
                           {name: name}, 'Local copy of ' + d.mod + ' made');
    if (out) say('Copied ' + d.mod + ' to ' + out.path);
  },

  removeMod: async d => {
    const users = d.users ? d.users.split(',').filter(Boolean) : [];
    const warning = users.length
      ? '\n\nIt is used by ' + users.join(', ') + ', so it will be taken out of their '
        + 'load orders too.'
      : '';
    if (!confirm('Remove "' + d.mod + '" from the config?' + warning
        + '\n\nDownloaded files are kept — remove those separately.')) return;
    const out = await send('DELETE', 'api/config/mods/' + encodeURIComponent(d.mod)
                           + (users.length ? '?force=true' : ''), undefined,
                           'Removed ' + d.mod + ' from the config');
    if (out) {
      const kept = (out.cached_versions || []).length;
      if (kept) say('Removed ' + d.mod + ' (' + kept + ' cached version(s) kept)');
    }
  },

  // --- workshop and local scan ---

  search: () => searchWorkshop(),
  page: d => searchWorkshop(+d.page),
  addWorkshop: d => addMod(d.id),
  scan: scanLocal,
  addLocal: d => addLocal(d.path),
};

// --- overview ------------------------------------------------------------------

// Declared rather than hand-written so the form, the collector, and the whitelist cannot
// drift apart. `k` is the dotted path the API expects.
const GLOBAL_FIELDS = [
  {k: 'mod_check_interval_minutes', t: 'num', label: 'Check for mod updates',
   note: 'minutes between automatic checks; 0 turns them off'},
  {k: 'mod_check_auto_download', t: 'bool', label: 'Download what it finds',
   note: 'safe while servers run - a new version is only activated at the next restart'},
  {k: 'gc_retention_days', t: 'num', label: 'Keep unused versions',
   note: 'days before automatic deletion; blank never deletes anything'},
  {k: 'download_timeout_seconds', t: 'num', label: 'Download timeout', note: 'seconds'},
  {k: 'supervise_poll_seconds', t: 'num', label: 'Supervise poll', note: 'seconds'},
  {k: 'stop_timeout_seconds', t: 'num', label: 'Stop timeout',
   note: 'seconds before a server is killed; DayZ flushes persistence on exit'},
  {k: 'server_branch', t: 'text', label: 'Server branch', note: 'blank = public/stable'},
  {k: 'mission_prefix', t: 'text', label: 'Mission prefix'},
  {k: 'per_instance_missions', t: 'bool', label: 'Per-instance missions',
   note: 'each server gets its own economy and persistence'},
  {k: 'rcon.startup_grace_seconds', t: 'num', label: 'RCON startup grace',
   note: 'seconds before RCON is expected to answer'},
  {k: 'rcon.early_warning_lead_seconds', t: 'num', label: 'Warn from',
   note: 'seconds before a restart'},
  {k: 'rcon.early_warning_interval_seconds', t: 'num', label: 'Warn every', note: 'seconds'},
  {k: 'rcon.final_warning_lead_seconds', t: 'num', label: 'Final warnings from',
   note: 'seconds before a restart'},
  {k: 'rcon.final_warning_interval_seconds', t: 'num', label: 'Final warn every',
   note: 'seconds'},
  {k: 'rcon.warning_message', t: 'text', label: 'Warning message',
   note: '{remaining} becomes "2 minutes"'},
  {k: 'rcon.shutdown_via_rcon', t: 'bool', label: 'Shut down via RCON',
   note: 'lets DayZ close on its own terms instead of being signalled'},
  {k: 'rcon.manage_battleye_config', t: 'bool', label: 'Manage BattlEye config',
   note: 'generates an RCON password when an instance has none'},
];

function globalField(f, values) {
  const id = 'g-' + f.k.replace(/\./g, '-');
  const v = values[f.k];
  let input;
  if (f.t === 'bool') {
    input = '<input type="checkbox"' + attr('id', id) + (v ? ' checked' : '') + '>';
  } else if (f.t === 'num') {
    input = '<input type="number"' + attr('id', id) + ' style="width:8rem"'
          + attr('value', v == null ? '' : v) + '>';
  } else {
    input = '<input type="text"' + attr('id', id) + ' style="width:18rem"'
          + attr('value', v == null ? '' : v) + '>';
  }
  return '<div class="field"><label>' + esc(f.label) + '</label>' + input
    + (f.note ? '<span class="note">' + esc(f.note) + '</span>' : '') + '</div>';
}

function managerPanel() {
  if (!last.global) return '';
  return '<h2>Manager settings</h2><div class="panel" data-form>'
    + GLOBAL_FIELDS.map(f => globalField(f, last.global.values)).join('')
    + '<div class="field"><label>&nbsp;</label>'
      + '<button class="primary" data-act="saveGlobal"' + (busy ? ' disabled' : '') + '>Save</button>'
      + '<span class="note">written to ' + esc(last.global.config_path)
      + ' &mdash; anything not here is edited in the file</span></div>'
    + '</div>';
}

function overviewRow(i) {
  const state = i.running
    ? '<span class="run">running</span>'
    : (i.held ? '<span class="held">held down</span>' : '<span class="stop">stopped</span>');
  const d = busy ? ' disabled' : '';
  const buttons = (i.running
    ? '<button class="danger" data-act="stop"' + attr('data-name', i.name) + d + '>Stop</button>'
      + '<button data-act="restart"' + attr('data-name', i.name) + d + '>Restart</button>'
    : '<button class="primary" data-act="start"' + attr('data-name', i.name) + d
      + '>Start</button>');
  const counts = [];
  if (i.mods.length) counts.push(i.mods.length + ' mods');
  if (i.server_mods.length) counts.push(i.server_mods.length + ' server-only');
  if (i.keep_mods.length) counts.push(i.keep_mods.length + ' kept');
  return '<tr>'
    + '<td><a href="#/server/' + encodeURIComponent(i.name) + '">' + esc(i.name) + '</a>'
    + '<td>' + state
    + '<td>' + i.port + (i.rcon_port ? ' <span class="note">rcon ' + i.rcon_port + '</span>' : '')
    + '<td><span class="note">' + (counts.join(' &middot; ') || '&mdash;') + '</span>'
    + '<td>' + esc(i.next_restart ? i.next_restart.replace('T', ' ').slice(0, 16) : 'no schedule')
    + '<td>' + buttons
    + '</tr>';
}

function renderOverview() {
  const d = busy ? ' disabled' : '';
  let h = '<div class="bar">'
    + '<button data-act="modsCheck"' + d + '>Check for mod updates</button>'
    + '<button data-act="modsUpdate"' + d + '>Update mods</button>'
    + '<button data-act="serverUpdate"' + d + '>Update server app</button>'
    + '<input id="token" type="password" placeholder="API token (only if set)">'
    + '</div>';

  h += '<h2>Servers</h2><table>'
    + '<tr><th>Name<th>State<th>Ports<th>Mods<th>Next restart<th></tr>'
    + last.instances.map(overviewRow).join('');
  if (!last.instances.length) h += '<tr><td colspan="6">none configured</tr>';
  h += '</table>';

  h += managerPanel();

  h += '<h2>Server app</h2><table><tr><th>Build<th></tr>';
  h += last.server.builds.map(b =>
    '<tr><td><code>' + esc(b) + '</code><td>' + (b === last.server.active ? 'newest' : '') + '</tr>'
  ).join('');
  if (!last.server.builds.length) h += '<tr><td colspan="2">none downloaded</tr>';
  h += '</table>';
  if (last.server.server_app_path) {
    h += '<p class="note">Instances use <code>' + esc(last.server.server_app_path) + '</code></p>';
  }
  return h;
}

// --- one server ----------------------------------------------------------------

let cfgEditing = null;

function launchPanel(i) {
  const cores = [];
  const total = last.server.cpu_count || 0;
  for (let c = 0; c < total; c++) {
    const on = i.cpu_affinity && i.cpu_affinity.includes(c);
    cores.push('<label><input type="checkbox"' + attr('value', c) + (on ? ' checked' : '')
      + '>' + c + '</label>');
  }
  const opt = (v, label) =>

const LIST_LABELS = {mods: 'loaded', server_mods: 'server only', keep_mods: 'kept, not loaded'};

function listContaining(instance, name) {
  if ((instance.mods || []).includes(name)) return 'mods';
  if ((instance.server_mods || []).includes(name)) return 'server_mods';
  if ((instance.keep_mods || []).includes(name)) return 'keep_mods';
  return null;
}

function instanceModRow(i, name, list, order) {
  const mod = last.mods.find(m => m.name === name) || {name: name, kind: '?'};
  const d = busy ? ' disabled' : '';
  const where = mod.kind === 'local'
    ? '<code>local</code> <span class="note">' + esc(mod.path || '') + '</span>'
    : '<code>' + esc(mod.workshop_id) + '</code>';
  const opt = v => '<option' + attr('value', v) + (v === list ? ' selected' : '') + '>'
    + LIST_LABELS[v] + '</option>';
  const dataset = attr('data-name', i.name) + attr('data-mod', name);
  return '<tr>'
    + '<td>' + (order == null ? '' : '<span class="note">' + order + '.</span> ') + esc(name)
    + '<td>' + where
    + '<td><select data-change="instSetList"' + dataset + d + '>'
      + opt('mods') + opt('server_mods') + opt('keep_mods') + '</select>'
    + '<td><button data-act="instLocalize"' + dataset + d + '>Local copy</button>'
      + '<button class="danger" data-act="instRemoveMod"' + dataset + d + '>Remove</button>'
    + '</tr>';
}

function instanceModsPanel(i) {
  let h = '<h2>Mods on this server</h2><table>'
    + '<tr><th>Mod<th>Source<th>Loaded as<th></tr>';
  // Load order first and numbered, because for -mod= the order is the whole point;
  // server-only and kept mods follow, where it does not matter.
  i.mods.forEach((n, idx) => { h += instanceModRow(i, n, 'mods', idx + 1); });
  i.server_mods.forEach(n => { h += instanceModRow(i, n, 'server_mods', null); });
  i.keep_mods.forEach(n => { h += instanceModRow(i, n, 'keep_mods', null); });
  const total = i.mods.length + i.server_mods.length + i.keep_mods.length;
  if (!total) h += '<tr><td colspan="4">no mods on this server</tr>';
  h += '</table>';

  const available = last.mods.filter(m => !listContaining(i, m.name));
  const d = busy ? ' disabled' : '';
  h += '<div class="panel"><h3>Add a configured mod</h3><div class="field">'
    + '<label>Mod</label><select id="add-mod"' + (available.length ? '' : ' disabled') + '>'
      + available.map(m => '<option' + attr('value', m.name) + '>' + esc(m.name) + '</option>').join('')
      + (available.length ? '' : '<option value="">every configured mod is already here</option>')
    + '</select>'
    + '<select id="add-list"><option value="mods">loaded</option>'
      + '<option value="server_mods">server only</option>'
      + '<option value="keep_mods">kept, not loaded</option></select>'
    + '<button class="primary" data-act="instAddMod"' + attr('data-name', i.name)
      + (available.length ? d : ' disabled') + '>Add</button>'
    + '</div>'

      + '<a href="#/mods">Mods</a>.</p></div>';

  // without touching anything is a no-op rather than a silent move to "mods".
  const current = last.instances.map(i => listContaining(i, name)).find(Boolean) || 'mods';
  const opt = (v, label) =>
    '<option' + attr('value', v) + (current === v ? ' selected' : '') + '>' + label + '</option>';

    const where = listContaining(i, name);

    return '<label><input type="checkbox"' + attr('value', i.name)

  return '<div class="panel" data-form><h3>Which servers load ' + esc(name) + '?</h3>'

      + '<button class="primary" data-act="saveAssign"' + attr('data-mod', name) + '>Save</button>'
      + '<button data-act="assign"' + attr('data-mod', name) + '>Cancel</button>'

  const where = users.length

let hits = null;          // null = the browser has not been used yet
let hitsTotal = 0;
let hitsQuery = '';
let hitsPage = 1;
let hitsPages = 1;
let pendingQuery = '';    // survives a repaint, so a background refresh cannot eat it

async function searchWorkshop(page) {
  // The query comes from the box on a new search, but from the last one when paging:
  // the box may have been typed into since, and page 2 must be page 2 of the results
  // actually on screen.
  const raw = page ? hitsQuery : val('q');
  if (!raw) return;
  hitsQuery = raw;
  hitsPage = page || 1;

  // A pasted link or a bare id is a lookup, not a search - and that path needs no API
  // key, so it works for people who never made one.
  const direct = raw.match(/^\s*(?:https?:\/\/\S*[?&]id=)?(\d{6,})\s*$/);
  const url = direct
    ? 'api/workshop/' + direct[1]
    : 'api/workshop/search?q=' + encodeURIComponent(raw) + '&page=' + hitsPage;

  busy = true; painted = ''; render();
  try {
    const r = await fetch(url, {headers: headers()});
    const out = await r.json();
    if (!r.ok) { say(out.detail || 'search failed', true); hits = []; hitsPages = 1; }
    else if (direct) { hits = [out]; hitsTotal = 1; hitsPages = 1; }
    else { hits = out.items; hitsTotal = out.total; hitsPages = out.pages; }
  } catch (e) {
    say('search failed: ' + e, true); hits = []; hitsPages = 1;
  } finally {
    busy = false; painted = ''; render();
    // Paging redraws the list above the fold; without this the second page opens
    // scrolled to wherever the first one was being read.
    if (page) {
      const box = document.getElementById('q');
      if (box) box.scrollIntoView({block: 'center'});
    }
  }
}

function pager() {
  if (hits === null || hitsPages <= 1) return '';
  const d = busy ? ' disabled' : '';
  const button = (page, label, on) =>
    '<button data-act="page"' + attr('data-page', page)
    + (on ? d : ' disabled') + '>' + label + '</button>';

  // A window around the current page, not every page: 50 pages of buttons is not a
  // navigation aid.
  const from = Math.max(1, Math.min(hitsPage - 2, hitsPages - 4));
  const to = Math.min(hitsPages, from + 4);
  let numbers = '';
  for (let p = from; p <= to; p++) {
    numbers += p === hitsPage
      ? '<button class="primary" disabled>' + p + '</button>'
      : button(p, p, true);
  }

  return '<div class="field" style="margin-top:.8rem">'
    + button(hitsPage - 1, '&larr; Prev', hitsPage > 1)
    + numbers
    + button(hitsPage + 1, 'Next &rarr;', hitsPage < hitsPages)
    + '<span class="note">page ' + hitsPage + ' of ' + hitsPages
    + ' &middot; ' + hitsTotal.toLocaleString() + ' matches</span></div>';
}

async function addMod(id) {
  const out = await send('POST', 'api/workshop/' + id + '/add',
                         {instances: ticked('.wtargets')}, 'Added mod ' + id);
  if (!out) return;
  // Mark it added rather than dropping the results: with paging, clearing them would
  // throw away the page being read and there is no way back to it but searching again.
  const hit = (hits || []).find(h => String(h.workshop_id) === String(id));
  if (hit) hit.configured_as = out.added;
  painted = ''; render();
}

function hitRow(h) {
  const img = h.preview_url
    ? '<img' + attr('src', h.preview_url) + ' alt="" loading="lazy">'
    : '<img alt="">';
  const meta = [];
  if (h.subscriptions) meta.push(h.subscriptions.toLocaleString() + ' subscribers');
  if (h.file_size) meta.push(mib(h.file_size));
  if (h.time_updated) {
    meta.push('updated ' + new Date(h.time_updated * 1000).toISOString().slice(0, 10));
  }
  meta.push('id ' + h.workshop_id);

  const action = h.configured_as
    ? '<span class="run">added as ' + esc(h.configured_as) + '</span>'
    : '<button class="primary" data-act="addWorkshop"' + attr('data-id', h.workshop_id)
      + (busy ? ' disabled' : '') + '>Add</button>';

  return '<div class="hit">' + img
    + '<div class="body">'
      + '<div class="title">' + esc(h.title) + '</div>'
      + '<div class="desc">' + esc(h.description) + '</div>'
      + '<div class="meta">' + meta.map(esc).join(' &middot; ') + '</div>'
    + '</div>'
    + '<div class="act">' + action + '</div>'
  + '</div>';
}

function targetBoxes(cls) {
  if (!last.instances.length) return '';

function workshopPanel() {
  let h = '<h2>Workshop</h2><div class="panel">'
    + '<div class="field">'
      + '<input type="text" id="q" data-enter="search"'
      + ' placeholder="Search, or paste a Workshop link or id"'

let localHits = null;
let localPath = '';

async function scanLocal() {
  const path = val('lp');
  if (!path) return;
  localPath = path;
  busy = true; painted = ''; render();
  try {
    const r = await fetch('api/localmods?path=' + encodeURIComponent(path), {headers: headers()});
    const out = await r.json();
    if (!r.ok) { say(out.detail || 'scan failed', true); localHits = []; }
    else { localHits = out.candidates; }
  } catch (e) {
    say('scan failed: ' + e, true); localHits = [];
  } finally {
    busy = false; painted = ''; render();
  }
}

async function addLocal(path) {
  // Its own checkboxes, not the Workshop panel's: ticking boxes in one panel must not
  // silently apply to an Add in the other.
  if (await send('POST', 'api/localmods/add', {path: path, instances: ticked('.ltargets')},
                 'Added local mod')) {
    localHits = null;
  }
}

function localRow(c) {

function ago(iso) {
  if (!iso) return 'never';
  const seconds = (Date.now() - new Date(iso).getTime()) / 1000;
  if (seconds < 90) return 'just now';
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return minutes + ' min ago';
  const hours = Math.round(minutes / 60);
  return hours < 48 ? hours + 'h ago' : Math.round(hours / 24) + 'd ago';
}

function updateBanner() {
  const u = last.updates;
  if (!u) return '';
  const when = 'checked ' + ago(u.last_checked)
    + (u.interval_minutes ? ', every ' + u.interval_minutes + ' min' : ', automatic checks off')
    + (u.auto_download ? ', downloading automatically' : '');
  if (!u.available.length) {
    return '<p class="note">Everything up to date &mdash; ' + esc(when) + '.</p>';
  }
  return '<p><span class="warn">' + u.available.length + ' update'
    + (u.available.length === 1 ? '' : 's') + ' available</span>: '
    + esc(u.available.join(', '))
    + ' <span class="note">&mdash; ' + esc(when)
    + (u.auto_download ? '' : '; press Update mods to download')
    + '</span></p>';
}

function renderMods() {
  const d = busy ? ' disabled' : '';
  let h = '<div class="bar">'
    + '<button data-act="modsCheck"' + d + '>Check for mod updates</button>'
    + '<button data-act="modsUpdate"' + d + '>Update mods</button>'
    + '</div>' + updateBanner();

  h += '<h2>Configured mods</h2><table>'
    + '<tr><th>Name<th>Source<th>Cached<th>Used by<th></tr>'
    + last.mods.map(modRow).join('');
  if (!last.mods.length) h += '<tr><td colspan="5">none configured</tr>';
  h += '</table>';

  if (assigning && last.mods.some(m => m.name === assigning)) h += assignPanel(assigning);

  h += workshopPanel() + localPanel();

  h += '<h2>Cached versions</h2><table>'
    + '<tr><th>Mod<th>Version<th>Size<th>Age<th>Status</tr>'
    + last.versions.map(versionRow).join('');
  if (!last.versions.length) h += '<tr><td colspan="5">nothing cached</tr>';
  h += '</table>';
  return h;
}

function renderJobs() {
  const running = jobs.filter(j => j.status === 'running');
  const recent = jobs.filter(j => j.status !== 'running').slice(0, 3);
  let h = '';
  for (const j of running) {
    h += '<div class="job"><span class="spin">&#9696;</span> ' + esc(j.kind)
       + ' running&hellip;</div>';
  }
  for (const j of recent) {
    const cls = j.status === 'succeeded' ? 'run' : 'err';
    const detail = j.detail ? ' &mdash; ' + esc(j.detail.split('\n')[0]) : '';
    h += '<div class="job"><span class="' + cls + '">' + esc(j.kind) + ' ' + j.status
       + '</span>' + detail + '</div>';
  }
  document.getElementById('jobs').innerHTML = h;
}

  overview: 'Refreshes every few seconds. Steam Guard is seeded once with '
          + '<code>dzsm login --interactive</code>.',
  server: 'Everything here applies at the server\'s next start &mdash; nothing is changed '
        + 'underneath a running server.',
  mods: 'Adding a mod configures it; downloading it is <b>Update mods</b>, and it is '
      + 'activated at each server\'s next start.',
};

function render() {
  const view = route();
  document.getElementById('nav').innerHTML = navBar(view);
  document.getElementById('c').innerHTML =
      view.page === 'server' ? renderServer(view.name)
    : view.page === 'mods' ? renderMods()
    : renderOverview();
  document.getElementById('foot').innerHTML = FOOTERS[view.page];

  const box = document.getElementById('token');
  if (box) {
    box.value = token();
    box.addEventListener('change', e => sessionStorage.setItem('dzsm-token', e.target.value));
  }
  const qbox = document.getElementById('q');
  if (qbox) qbox.value = pendingQuery;
  const lbox = document.getElementById('lp');
  if (lbox) lbox.value = localPath;
  dirty = false;
  renderJobs();
}

let painted = '';

async function load() {
  try {
    const [inst, vers, srv, health, jl, mods, glob, upd] = await Promise.all([
      fetch('api/instances').then(r => r.json()),
      fetch('api/versions').then(r => r.json()),
      fetch('api/server').then(r => r.json()),
      fetch('api/health').then(r => r.json()),
      fetch('api/jobs').then(r => r.json()),
      fetch('api/mods').then(r => r.json()),
      fetch('api/config/global').then(r => r.json()),
      fetch('api/updates').then(r => r.json()),
    ]);
    last = {instances: inst, versions: vers, server: srv, mods: mods, global: glob,
            updates: upd};
    jobs = jl;
    document.getElementById('root').textContent = health.root;

    // Only repaint when something actually changed. Rebuilding the DOM on a timer wipes
    // whatever is being typed and can swallow a click that lands mid-refresh.
    //
    // age_days is recomputed server-side on every request, so it is rounded to the
    // precision actually displayed — otherwise nothing ever compares equal and the page
    // repaints forever.
    // ago(last_checked) is included because it is what the banner shows: the timestamp
    // itself only changes when a check runs, so without this "5 min ago" would still say
    // that half an hour later.
    const snapshot = JSON.stringify(
      [last, jobs, busy, location.hash, cfgEditing, assigning,
       ago(last.updates && last.updates.last_checked)],
      (k, v) => (k === 'age_days' && typeof v === 'number' ? v.toFixed(1) : v));
    if (snapshot === painted) return;
    // Never repaint over unsaved edits, an open assignment panel, or a search box being
    // typed into.
    if (dirty || assigning) return;
    const focused = document.activeElement && document.activeElement.id;
    if (focused === 'token' || focused === 'q' || focused === 'lp') return;
    painted = snapshot;
    render();
  } catch (e) {
    document.getElementById('c').innerHTML =
      '<span class="err">failed to load: ' + esc(e) + '</span>';
  }
}

// The search boxes keep their text across repaints; they are not [data-form], because a
// half-typed query should not freeze the page's live updates the way an unsaved setting
// does.
document.addEventListener('input', e => {
  if (e.target.id === 'q') pendingQuery = e.target.value;
  if (e.target.id === 'lp') localPath = e.target.value;
});

render();
load();
setInterval(() => load(), 4000);
</script>
</body>
</html>

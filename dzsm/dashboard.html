<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dzsm</title>
<style>
 body { font: 14px system-ui, sans-serif; margin: 2rem; background: #111; color: #ddd }
 h1 { font-size: 1.2rem; margin: 0 0 1.5rem; display: flex; gap: 1rem; align-items: baseline;
      flex-wrap: wrap }
 h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .05em;
      color: #888; margin: 2rem 0 .5rem }
 table { border-collapse: collapse; width: 100% }
 td, th { text-align: left; padding: .45rem .8rem .45rem 0; border-bottom: 1px solid #262626;
          vertical-align: top }
 th { color: #888; font-weight: 500 }
 .run { color: #4ade80 } .stop { color: #777 } .warn { color: #fbbf24 }
 .held { color: #22d3ee } .err { color: #f87171 }
 code { color: #93c5fd }
 a { color: #93c5fd; text-decoration: none }
 a:hover { text-decoration: underline }
 nav { display: flex; gap: 1rem; font-size: .9rem }
 nav a { color: #888; padding-bottom: .1rem; border-bottom: 2px solid transparent }
 nav a.on { color: #ddd; border-bottom-color: #2f6f4f }
 .note { color: #666; font-size: .85rem }
 p.note { margin-top: 2rem }
 button { font: inherit; background: #1e1e1e; color: #ddd; border: 1px solid #3a3a3a;
          border-radius: 4px; padding: .25rem .7rem; cursor: pointer; margin-right: .3rem }
 button:hover:not(:disabled) { background: #2a2a2a; border-color: #555 }
 button:disabled { opacity: .4; cursor: default }
 button.primary { border-color: #2f6f4f; color: #4ade80 }
 button.danger { border-color: #6f2f2f; color: #f87171 }
 #msg { margin: 1rem 0; padding: .6rem .8rem; border-radius: 4px; display: none }
 #msg.show { display: block }
 #msg.ok { background: #16281c; color: #4ade80 }
 #msg.bad { background: #2a1616; color: #f87171 }
 #jobs { margin: 1rem 0 }
 .job { padding: .4rem 0; color: #aaa }
 .spin { display: inline-block; animation: spin 1s linear infinite }
 @keyframes spin { to { transform: rotate(360deg) } }
 #token { font: inherit; background: #1a1a1a; color: #ddd; border: 1px solid #333;
          border-radius: 4px; padding: .2rem .5rem; width: 14rem }
 .bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap }
 .panel { border: 1px solid #2c2c2c; border-radius: 6px; padding: 1rem; margin: .5rem 0 1.5rem;
          background: #161616 }
 .panel h3 { margin: 0 0 .8rem; font-size: .9rem; color: #bbb }
 .field { display: flex; gap: .6rem; align-items: center; margin-bottom: .6rem; flex-wrap: wrap }
 .field > label:first-child { width: 12rem; color: #888; flex: none }
 .cores, .stags { display: flex; flex-wrap: wrap; gap: .35rem; max-width: 40rem }
 .cores label, .stags label { border: 1px solid #333; border-radius: 4px;
                padding: .1rem .45rem;
                cursor: pointer; user-select: none; font-variant-numeric: tabular-nums }
 /* :has() keeps the tick state purely declarative — the alternative was an inline
    onchange on every core, which is exactly the pattern this file no longer uses. */
 .cores label:has(input:checked), .stags label:has(input:checked)
   { border-color: #2f6f4f; color: #4ade80; background: #16281c }
 /* Hidden visually but still focusable and still in the accessibility tree.
    display:none would drop it out of the tab order entirely. */
 .cores input, .stags input { position: absolute; opacity: 0; width: 1px; height: 1px }
 .cores label:focus-within, .stags label:focus-within
   { outline: 2px solid #4ade80; outline-offset: 1px }
 select, input[type=number], input[type=text] {
   font: inherit; background: #1a1a1a; color: #ddd; border: 1px solid #333;
   border-radius: 4px; padding: .2rem .4rem }
 textarea { font: 12px ui-monospace, Consolas, monospace; width: 100%; min-height: 22rem;
            background: #0d0d0d; color: #ddd; border: 1px solid #333; border-radius: 4px;
            padding: .6rem }
 .flags label { margin-right: 1rem; color: #ccc }
 .hit { display: flex; gap: .8rem; padding: .7rem 0; border-bottom: 1px solid #222 }
 .hit img { width: 96px; height: 54px; object-fit: cover; border-radius: 4px;
            background: #222; flex: none }
 .hit .body { flex: 1; min-width: 0 }
 .hit .title { font-weight: 600 }
 .hit .desc { color: #888; font-size: .85rem; margin: .2rem 0;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden }
 .hit .meta { color: #666; font-size: .8rem }
 .hit .act { flex: none; text-align: right }
 .targets label { display: block; color: #ccc; font-size: .85rem }
 #feed { max-height: 18rem; overflow-y: auto; background: #0d0d0d; border: 1px solid #262626;
         border-radius: 4px; padding: .5rem .7rem; font: 12px ui-monospace, Consolas, monospace }
 #feed .line { padding: .1rem 0; white-space: pre-wrap; word-break: break-word }
 #feed .chan { color: #666 }
 #feed .who { color: #93c5fd; font-weight: 600 }
 #chat { font: inherit; background: #1a1a1a; color: #ddd; border: 1px solid #333;
         border-radius: 4px; padding: .3rem .5rem }
 .head { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; margin-bottom: 1rem }
 .head h2 { margin: 0; font-size: 1.1rem; text-transform: none; letter-spacing: 0; color: #ddd }
</style>
</head>
<body>
<h1>dzsm
  <nav id="nav"></nav>
  <span class="note" id="root"></span>
</h1>

<div id="msg"></div>
<div id="jobs"></div>
<div id="c">loading&hellip;</div>
<p class="note" id="fingerprint" style="word-break:break-all"></p>

<p class="note" id="foot"></p>

<script>
// Every dynamic value below is interpolated into a data-* attribute and read back through
// element.dataset, never into inline handler source. Building `onclick="f(' + value + ')"`
// is what broke the mod buttons: JSON.stringify emits double quotes, which terminate the
// attribute early and leave a syntax error the browser reports nowhere. Delegation makes
// that class of bug impossible — esc() covers the quote, and the value never becomes code.
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mib = b => (b / 1048576).toFixed(1) + ' MiB';
const age = d => d == null ? '?' : d.toFixed(1) + 'd';
const attr = (name, value) => ' ' + name + '="' + esc(value) + '"';

// A workshop id is the thing people cross-check against Steam: is this the mod I think
// it is, what changed in the update, does the author say it is 1.30-ready. A new tab,
// because this page is often the only thing holding what the server is doing, and
// noopener because the opened page must not get a handle on this one.
const WORKSHOP_URL = 'https://steamcommunity.com/sharedfiles/filedetails/?id=';

function steamLink(workshopId, inner) {
  // Local mods have no Workshop page, so callers pass a falsy id and get plain text.
  if (!workshopId) return inner;
  return '<a' + attr('href', WORKSHOP_URL + workshopId)
    + ' target="_blank" rel="noopener noreferrer">' + inner + '</a>';
}

let busy = false;
let jobs = [];
let unauthorized = false;   // a gated read came back 401: the token is missing or wrong

// Live player lists, per instance, and when each was last fetched. Kept out of `last`
// because they are polled on their own slower schedule.
let livePlayers = {};
const livePlayersAt = {};
const LIVE_PLAYERS_SECONDS = 10;

// Live chat and event feed, per instance, with the cursor each was last read to.
let feeds = {};
const FEED_HISTORY = 50;   // stored lines to load when first opening a server page
const FEED_LINES = 300;    // how much to keep in the page before trimming

// Available missions per instance. Keyed by instance and deleted on save, which is what
// makes the next paint re-read the resolved name from the server rather than guess it.
const missions = {};

// Defaults for the "add a server" form, and what has been typed into it. Both held
// outside the DOM: a refused save repaints the panel, and losing a half-filled form to
// an error message is its own small insult.
let newServer = null;
let pendingNewServer = {};

// The map someone has picked but not yet saved, per instance. Held outside the DOM for
// the same reason the search and chat boxes are: a repaint rebuilds the panel, and a
// <select> rebuilt from server state loses the choice. Reading the value back out of the
// element at save time meant a repaint landing in between silently saved the *old* map.
const pendingMission = {};
let last = {instances: [], versions: [], server: {builds: []}, mods: [], global: null,
            updates: null, steam: null};

function token() { return sessionStorage.getItem('dzsm-token') || ''; }
function headers() { const t = token(); return t ? {'X-DZSM-Token': t} : {}; }

function say(text, bad) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'show ' + (bad ? 'bad' : 'ok');
  if (!bad) setTimeout(() => { el.className = ''; }, 4000);
}

async function post(path, label) {
  if (busy) return;
  busy = true;
  render();
  try {
    const r = await fetch(path, {method: 'POST', headers: headers()});
    const body = await r.json().catch(() => ({}));
    if (!r.ok) say(body.detail || (label + ' failed (' + r.status + ')'), true);
    else if (body.id) say(label + ' started');       // 202 with a job id
    else say(label + ' done');
  } catch (e) {
    say(label + ' failed: ' + e, true);
  } finally {
    busy = false; painted = ''; load();
  }
}

async function send(method, path, body, label) {
  if (busy) return false;
  busy = true;
  render();
  try {
    const r = await fetch(path, {
      method: method,
      headers: Object.assign({'Content-Type': 'application/json'}, headers()),
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) { say(out.detail || (label + ' failed (' + r.status + ')'), true); return false; }
    // The label is the whole sentence, not a subject the caller appends "saved" to: a
    // removal reported as "Expansion removed from chernarus saved" reads like a bug.
    const pending = out.applies_at_next_start;
    const later = Array.isArray(pending) ? pending.length : !!pending;
    say(label + (later ? ' - applies at the next start' : ''));
    return out;
  } catch (e) {
    say(label + ' failed: ' + e, true);
    return false;
  } finally {
    busy = false; dirty = false; painted = ''; load();
  }
}

// --- routing -------------------------------------------------------------------
// Hash routing rather than paths: the dashboard is one static file served at /, so a
// real path would 404 on reload.

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h.startsWith('/server/')) return {page: 'server', name: h.slice('/server/'.length)};
  if (h === '/mods') return {page: 'mods'};
  return {page: 'overview'};
}

window.addEventListener('hashchange', () => {
  closeCfg(); assigning = null; dirty = false; painted = ''; render();
});

function navBar(view) {
  const link = (href, label, on) =>
    '<a href="' + href + '"' + (on ? ' class="on"' : '') + '>' + label + '</a>';
  return link('#/', 'Overview', view.page === 'overview')
       + link('#/mods', 'Mods', view.page === 'mods')
       + (view.page === 'server'
          ? '<a href="#/server/' + encodeURIComponent(view.name) + '" class="on">'
            + esc(view.name) + '</a>'
          : '');
}

// --- event delegation ----------------------------------------------------------

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) { say('no such action: ' + el.dataset.act, true); return; }
  e.preventDefault();
  fn(el.dataset, el);
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const fn = actions[el.dataset.change];
  if (fn) fn(el.dataset, el);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target.closest('[data-enter]');
  if (!el) return;
  const fn = actions[el.dataset.enter];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});

// A form panel with unsaved edits must never be repainted out from under the person
// typing in it. Scoped to [data-form] so search boxes and the token field, which are
// preserved separately, do not freeze the page's live updates.
let dirty = false;
// Both events: a text field fires `input`, but a <select> or checkbox someone has just
// changed is only reliably reported by `change`. Missing that left a repaint free to
// rebuild a panel out from under an unsaved choice.
for (const kind of ['input', 'change']) {
  document.addEventListener(kind, e => {
    if (e.target.closest('[data-form]')) dirty = true;
  });
}

const val = id => {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
};
const num = id => { const v = val(id); return v === '' ? null : +v; };
const checked = id => {
  const el = document.getElementById(id);
  return el ? el.checked : false;
};
const ticked = sel => [...document.querySelectorAll(sel + ' input:checked')].map(e => e.value);

// --- actions -------------------------------------------------------------------

const actions = {
  start: d => post('api/instances/' + encodeURIComponent(d.name) + '/start', 'Start ' + d.name),
  stop: d => post('api/instances/' + encodeURIComponent(d.name) + '/stop', 'Stop ' + d.name),
  restart: d => post('api/instances/' + encodeURIComponent(d.name) + '/restart',
                     'Restart ' + d.name),
  modsCheck: () => post('api/mods/check', 'Check for mod updates'),
  modsUpdate: () => post('api/mods/update', 'Mod update'),
  serverUpdate: () => post('api/server/update', 'Server app update'),
  verifySteam: () => post('api/steam/verify', 'Steam session check'),

  createServer: async () => {
    const name = val('ns-name');
    if (!name) { say('give the server a name', true); return; }
    const port = num('ns-port');
    const body = {name: name, port: port, mission_source: val('ns-map') || null};
    const copy = val('ns-copy');
    if (copy) body.copy_mods_from = copy;

    // Held outside the DOM so a refused save (name taken, port clash) does not lose
    // what was typed when the panel repaints with the error.
    pendingNewServer = {name: name, port: port};
    const out = await send('POST', 'api/instances', body, 'Added server ' + name);
    if (out) {
      pendingNewServer = {};
      newServer = null;              // refetch, so the next suggested port moves on
      say('Added ' + out.name + ' on port ' + out.port
          + ' (uses ' + out.claimed_ports.join(', ') + ')');
      location.hash = '#/server/' + encodeURIComponent(out.name);
    }
  },

  // Live preview without a round trip: the derived name's suffix comes from the chosen
  // source, and seeing it change is what makes clear that picking a map renames the world.
  previewMission: (d, el) => {
    pendingMission[d.name] = el.value;
    const m = missions[d.name];
    const label = document.getElementById('missionname');
    if (!m || !label) return;
    label.textContent = m.mission
      || m.prefix + '_' + d.name + '.' + el.value.split('.').pop();
  },

  saveMission: async d => {
    // The held choice, not the element's current value: see pendingMission.
    const source = pendingMission[d.name] || val('f-missionsource');
    if (!source) return;
    // mission_source only. `mission` is left alone deliberately: when it is unset the
    // name derives from this source, and when someone has set it explicitly, silently
    // rewriting it would undo a decision they made by hand.
    if (await send('PATCH', 'api/instances/' + encodeURIComponent(d.name) + '/settings',
                   {mission_source: source}, 'Map for ' + d.name + ' saved')) {
      delete missions[d.name];        // refetch, so the resolved name comes from the server
      delete pendingMission[d.name];  // saved, so it is no longer pending
    }
  },

  sendChat: async d => {
    const box = document.getElementById('chat');
    const message = box.value.trim();
    if (!message) return;
    // Cleared optimistically: the message appears in the feed when the server echoes it
    // back, and leaving the text sitting there invites sending it twice.
    box.value = '';
    pendingChat = '';
    const name = d.name || route().name;
    if (!await send('POST', 'api/instances/' + encodeURIComponent(name) + '/say',
                    {message: message}, 'Sent to ' + name)) {
      pendingChat = message;   // put it back so it is not lost
      painted = ''; render();
    }
  },

  // --- manager settings (overview) ---

  saveGlobal: async () => {
    const current = last.global.values;
    const patch = {};
    for (const f of GLOBAL_FIELDS) {
      const id = 'g-' + f.k.replace(/\./g, '-');
      const v = f.t === 'bool' ? checked(id)
              : f.t === 'num' ? num(id)
              : (val(id) || null);
      // Only what actually changed. Sending every field would write each one explicitly,
      // turning fifteen defaults into fifteen frozen settings — a later change to a
      // default would then never reach a config whose owner once clicked Save.
      if (v !== (current[f.k] === undefined ? null : current[f.k])) patch[f.k] = v;
    }
    if (!Object.keys(patch).length) { say('Manager settings unchanged'); return; }
    await send('PATCH', 'api/config/global', patch, 'Manager settings saved');
  },

  // --- one server ---

  saveLaunch: async d => {
    const cores = ticked('.cores');
    const patch = {
      // null removes the key and restores the default, which is what "all cores" and
      // "leave the priority alone" actually mean.
      cpu_affinity: cores.length ? cores.map(Number) : null,
      priority: val('f-priority') || null,
      cpu_count: num('f-cpucount'),
      restart_after_hours: num('f-hours'),
      server_executable: val('f-exe') || null,
      dologs: checked('f-dologs'),
      adminlog: checked('f-adminlog'),
      netlog: checked('f-netlog'),
      freezecheck: checked('f-freezecheck'),
      rcon_live: checked('f-rconlive'),
    };
    await send('PATCH', 'api/instances/' + encodeURIComponent(d.name) + '/settings',
               patch, 'Settings for ' + d.name + ' saved');
  },

  savePorts: async d => {
    await send('PATCH', 'api/instances/' + encodeURIComponent(d.name) + '/settings',
               // null removes the key, which is what an emptied box means: go back to
               // deriving it from the game port.
               {steam_query_port: num('f-queryport')},
               'Ports for ' + d.name + ' saved');
  },

  editCfg: async d => {
    if (cfgEditing === d.name) { closeCfg(); painted = ''; render(); return; }
    try {
      const r = await fetch('api/instances/' + encodeURIComponent(d.name) + '/serverdz',
                            {headers: headers()});
      const out = await r.json();
      if (!r.ok) { say(out.detail || 'could not read serverDZ.cfg', true); return; }
      // Held outside the DOM, then rendered. Assigning .value after render() put the
      // text somewhere the next repaint threw away.
      cfgEditing = d.name; cfgText = out.text; cfgPath = out.path;
      painted = ''; render();
    } catch (e) { say('could not read serverDZ.cfg: ' + e, true); }
  },

  saveCfg: async d => {
    // cfgText is the record of what was typed, not the box: a save that read an emptied
    // box would write that emptiness over the file.
    const el = document.getElementById('cfgtext');
    const text = el ? el.value : cfgText;
    if (text === null) { say('nothing to save - reopen the editor', true); return; }
    if (await send('PUT', 'api/instances/' + encodeURIComponent(d.name) + '/serverdz',
                   {text: text}, 'serverDZ.cfg for ' + d.name + ' saved')) {
      closeCfg();
    }
  },

  // --- a server's mods ---

  kick: async d => {
    const reason = prompt('Kick ' + d.player + ' - reason (optional):');
    if (reason === null) return;
    await send('POST', 'api/instances/' + encodeURIComponent(d.name) + '/kick',
               {number: +d.number, reason: reason}, 'Kicked ' + d.player);
  },

  ban: async d => {
    // Minutes, because a permanent ban asked for by a mis-click is the worst outcome
    // here and typing a number is a moment's thought. Empty means permanent, which is
    // BattlEye's own convention for 0.
    const minutes = prompt('Ban ' + d.player + ' for how many minutes? '
                           + '(blank = permanent)', '60');
    if (minutes === null) return;
    const reason = prompt('Reason (optional):');
    if (reason === null) return;
    await send('POST', 'api/instances/' + encodeURIComponent(d.name) + '/ban',
               {number: +d.number, minutes: +minutes || 0, reason: reason},
               'Banned ' + d.player);
  },

  instAddMod: async d => {
    const mod = val('add-mod');
    if (!mod) { say('pick a mod to add', true); return; }
    await send('PUT', 'api/instances/' + encodeURIComponent(d.name) + '/mods/'
               + encodeURIComponent(mod), {list_name: val('add-list') || 'mods'},
               'Added ' + mod + ' to ' + d.name);
  },

  instSetList: async (d, el) => {
    await send('PUT', 'api/instances/' + encodeURIComponent(d.name) + '/mods/'
               + encodeURIComponent(d.mod), {list_name: el.value},
               d.mod + ' on ' + d.name + ' is now ' + LIST_LABELS[el.value]);
  },

  instRemoveMod: async d => {
    if (!confirm('Remove "' + d.mod + '" from ' + d.name + '?\n\nIt stays configured and '
                 + 'stays downloaded — this only takes it out of this server.')) return;
    await send('DELETE', 'api/instances/' + encodeURIComponent(d.name) + '/mods/'
               + encodeURIComponent(d.mod), undefined, 'Removed ' + d.mod + ' from ' + d.name);
  },

  instLocalize: async d => {
    const suggested = d.mod + '_' + d.name;
    const name = prompt(
      'Copy "' + d.mod + '" into localmods/ and switch ' + d.name + ' over to the copy?\n\n'
      + 'The copy is never updated by Steam, so it is yours to edit. Other servers keep '
      + 'using the original.\n\nName for the copy:', suggested);
    if (!name) return;
    const out = await send('POST', 'api/instances/' + encodeURIComponent(d.name) + '/mods/'
                           + encodeURIComponent(d.mod) + '/localize', {name: name},
                           'Local copy of ' + d.mod + ' made');
    if (out) say('Copied ' + d.mod + ' to ' + out.path
                 + (out.copied_version ? ' (from version ' + out.copied_version + ')' : ''));
  },

  // --- all mods ---

  assign: d => { assigning = (assigning === d.mod ? null : d.mod); painted = ''; render(); },

  saveAssign: async d => {
    if (await send('PATCH', 'api/config/mods/' + encodeURIComponent(d.mod) + '/instances',
                   {instances: ticked('.atargets'), list_name: val('a-list')},
                   'Assignment for ' + d.mod + ' saved')) {
      assigning = null;
    }
  },

  localizeMod: async d => {
    const name = prompt(
      'Make an editable local copy of "' + d.mod + '"?\n\nIt is added as a separate mod, '
      + 'not attached to any server — assign it afterwards.\n\nName for the copy:',
      d.mod + '_copy');
    if (!name) return;
    const out = await send('POST', 'api/config/mods/' + encodeURIComponent(d.mod) + '/localize',
                           {name: name}, 'Local copy of ' + d.mod + ' made');
    if (out) say('Copied ' + d.mod + ' to ' + out.path);
  },

  removeMod: async d => {
    const users = d.users ? d.users.split(',').filter(Boolean) : [];
    const warning = users.length
      ? '\n\nIt is used by ' + users.join(', ') + ', so it will be taken out of their '
        + 'load orders too.'
      : '';
    if (!confirm('Remove "' + d.mod + '" from the config?' + warning
        + '\n\nDownloaded files are kept — remove those separately.')) return;
    const out = await send('DELETE', 'api/config/mods/' + encodeURIComponent(d.mod)
                           + (users.length ? '?force=true' : ''), undefined,
                           'Removed ' + d.mod + ' from the config');
    if (out) {
      const kept = (out.cached_versions || []).length;
      if (kept) say('Removed ' + d.mod + ' (' + kept + ' cached version(s) kept)');
    }
  },

  // --- workshop and local scan ---

  search: () => { clearTimeout(searchTimer); searchWorkshop(); },
  page: d => searchWorkshop(+d.page),

  // Changing either re-runs the search immediately rather than waiting for Search to be
  // pressed again: a filter that needs a second click reads as a filter that did not
  // work. From the BOX, not the held query - paging has to stay on the results being
  // read, but someone adjusting a filter is looking straight at the box, and emptying it
  // and ticking a category must become a browse rather than silently keeping the old
  // text. That is what it did first.
  sort: (d, el) => { hitsSort = el.value; searchWorkshop(); },

  tag: (d, el) => {
    hitsTags = SEARCH_TAGS.filter(
      tag => tag === el.value ? el.checked : hitsTags.includes(tag));
    searchWorkshop();
  },
  addWorkshop: d => addMod(d.id),
  scan: scanLocal,
  addLocal: d => addLocal(d.path),
};

function globalField(f, values) {
  const id = 'g-' + f.k.replace(/\./g, '-');
  const v = values[f.k];
  let input;
  if (f.t === 'bool') {
    input = '<input type="checkbox"' + attr('id', id) + (v ? ' checked' : '') + '>';
  } else if (f.t === 'num') {
    input = '<input type="number"' + attr('id', id) + ' style="width:8rem"'
          + attr('value', v == null ? '' : v) + '>';
  } else {
    input = '<input type="text"' + attr('id', id) + ' style="width:18rem"'
          + attr('value', v == null ? '' : v) + '>';
  }
  return '<div class="field"><label>' + esc(f.label) + '</label>' + input
    + (f.note ? '<span class="note">' + esc(f.note) + '</span>' : '') + '</div>';
}

function steamPanel() {
  const s = last.steam;
  if (!s) return '';
  const d = busy ? ' disabled' : '';

  // Three states, not two. "Never verified" is not "broken" — a fresh install has done
  // nothing to exercise the session yet, and shouting at someone about a login that is
  // probably fine trains them to ignore the panel.
  let status;
  if (s.ok === true) {
    status = '<span class="run">signed in</span> <span class="note">verified '
           + esc(ago(s.checked_at)) + '</span>';
  } else if (s.ok === false) {
    // Deliberately not "needs a Steam Guard code": a refused sign-in and a Guard prompt
    // both land here, and naming the wrong one sends people looking for a code that was
    // never asked for. The detail line below says which it actually was.
    status = '<span class="err">cannot sign in</span> <span class="note">checked '
           + esc(ago(s.checked_at)) + '</span>';
  } else {
    status = '<span class="note">not verified yet</span>';
  }

  let h = '<h2>Steam</h2><div class="panel">'
    + '<div class="field"><label>Account</label><code>' + esc(s.username) + '</code></div>'
    + '<div class="field"><label>Session</label>' + status + '</div>';

  if (!s.steamcmd_installed) {
    h += '<div class="field"><label>&nbsp;</label><span class="warn">steamcmd is not '
       + 'installed yet &mdash; it downloads itself on the first Steam operation</span></div>';
  }

  if (s.ok === false) {
    h += '<div class="field"><label>&nbsp;</label><span class="note">'
       + esc(s.detail || 'steamcmd could not authenticate') + '</span></div>'
       + '<div class="field"><label>Fix it</label><code>' + esc(s.login_command) + '</code></div>'
       + '<div class="field"><label>&nbsp;</label><span class="note">Run that in a '
       + 'terminal. It has to be a terminal: your password and Guard code go straight '
       + 'into steamcmd, and dzsm never sees them &mdash; which is why there is no login '
       + 'box here. Downloads will fail until it is done.</span></div>';
  }

  h += '<div class="field"><label>&nbsp;</label>'
    + '<button data-act="verifySteam"' + d + '>Verify now</button>'
    + '<span class="note">'
    + (s.password_env_set
       ? 'a password is set in the environment; steamcmd uses it'
       : 'no password stored &mdash; steamcmd signs in from its own cached sentry')
    + '</span></div>';
  return h + '</div>';
}

function managerPanel() {
  if (!last.global) return '';
  return '<h2>Manager settings</h2><div class="panel" data-form>'

    + '</div>';

function countdown(iso) {
  const seconds = (new Date(iso).getTime() - Date.now()) / 1000;
  if (seconds <= 0) return 'now';
  if (seconds < 90) return 'in ' + Math.round(seconds) + 's';
  return 'in ' + Math.round(seconds / 60) + ' min';
}

function serverCountdowns() {
  const s = last.updates && last.updates.server;
  if (!s) return '';
  return Object.values(s.restarting || {}).map(countdown).join(',')
       + '|' + ago(s.checked_at);
}

function dzsmUpdateBanner() {
  const d = last.updates && last.updates.dzsm;
  if (!d || !d.update_available) return '';
  // Told, not offered: there is no button, because fetching a new binary is a decision
  // taken at a terminal by someone who knows what the servers are doing.
  return '<p><span class="warn">dzsm ' + esc(d.latest) + ' is available</span> '
    + '<span class="note">&mdash; running ' + esc(d.running) + '. Run '
    + '<code>dzsm update</code> on the server; it takes effect at the next start. '
    + '</span><a' + attr('href', d.notes_url)
    + ' target="_blank" rel="noopener noreferrer">release notes</a></p>';
}

function gameUpdateBanner() {
  const s = last.updates && last.updates.server;
  if (!s) return '';

  let h = '';
  // Not an early return: a build can be downloaded by hand with checking off, and the
  // grace restart and pin warning below still apply when it has been.
  if (!s.checking) {
    h += '<p class="note">Not checking for game updates. When DayZ updates, clients '
      + 'update themselves and a server left on the old build stops accepting them.</p>';
  } else if (s.update_available) {
    h += '<p><span class="warn">Game update available</span> &mdash; Steam has build '
      + '<code>' + esc(s.latest) + '</code>, this install has '
      + (s.installed ? '<code>' + esc(s.installed) + '</code>' : 'none')
      + '. <span class="note">Clients update themselves, so servers on the old build '
      + 'will refuse them'
      + (s.auto_download ? '. Downloading automatically.' : ' &mdash; press Update server app.')
      + '</span></p>';
  } else if (s.latest) {
    h += '<p class="note">Game build <code>' + esc(s.latest) + '</code> is current '
      + '&mdash; checked ' + esc(ago(s.checked_at)) + '.</p>';
  } else {
    h += '<p class="note">Game build not checked yet.</p>';
  }

  // Instances already holding a newer build on disk, counting down to the restart that
  // picks it up. This is the only place that window is visible before it happens.
  const restarting = Object.entries(s.restarting || {});
  if (restarting.length) {
    h += '<p><span class="held">Restarting onto the new build</span>: '
      + restarting.map(([name, at]) =>
          '<a href="#/server/' + encodeURIComponent(name) + '">' + esc(name) + '</a> '
          + esc(countdown(at))).join(', ')
      + ' <span class="note">&mdash; players are being warned over RCON</span></p>';
  }

  if ((s.pinned_behind || []).length) {
    h += '<p><span class="warn">Pinned to an older build</span>: '
      + s.pinned_behind.map(n =>
          '<a href="#/server/' + encodeURIComponent(n) + '">' + esc(n) + '</a>').join(', ')
      + ' <span class="note">&mdash; a <code>server_build</code> pin is never moved '
      + 'automatically, so these will not accept updated clients until the pin changes'
      + '</span></p>';
  }
  return h;
}

// The vanilla launcher only lists servers whose query port is in Steam's classic range.
// A warning rather than a refusal, and the default is deliberately left outside it:
// consecutive ports are what most servers run, and most players arrive through DZSA,
// which finds a server wherever its query port is.
const VANILLA_QUERY_RANGE = [27015, 27019];

function launcherNote(port) {
  const low = VANILLA_QUERY_RANGE[0], high = VANILLA_QUERY_RANGE[1];
  if (port >= low && port <= high) {
    return '<span class="note">inside ' + low + '-' + high + ', so the vanilla launcher '
      + 'lists this server</span>';
  }
  return '<span class="warn">' + esc(port) + ' is outside ' + low + '-' + high + '</span>'
    + '<span class="note">vanilla launcher only shows servers with the query port set to '
    + low + '-' + high + '. DZSA and a direct connect find it either way.</span>';
}

function portsPanel(i) {
  // The whole block, not just the editable field: the point of pinning a query port is
  // that the layout is predictable, and that is only visible when it is all laid out.
  const derived = i.port + 1;
  return '<h2>Ports</h2><div class="panel" data-form>'
    + '<div class="field"><label>Game</label><code>' + i.port + '</code>'
      + '<span class="note">set by <code>port</code>; the rest follow it</span></div>'
    + '<div class="field"><label>Steam query</label>'
      + '<input type="number" id="f-queryport" min="1" max="65535" style="width:6rem"'
      + attr('value', i.steam_query_port_pin == null ? '' : i.steam_query_port_pin)
      + attr('placeholder', derived) + '>'
      + '<span class="note">blank = ' + derived + ' (game port +1). This is the port the '
      + 'in-game browser and DZSA find the server on</span></div>'
    + '<div class="field"><label>&nbsp;</label>'
      + launcherNote(i.steam_query_port) + '</div>'
    + '<div class="field"><label>BattlEye RCON</label>'
      + '<code>' + (i.rcon_port ? i.rcon_port : 'off') + '</code>'
      + '<span class="note">game port +3 unless <code>rcon_port</code> says otherwise'
      + '</span></div>'
    + '<div class="field"><label>&nbsp;</label>'
      + '<button class="primary" data-act="savePorts"' + attr('data-name', i.name)
      + (busy ? ' disabled' : '') + '>Save</button>'
      + '<span class="note">applies at the next start</span></div>'
    + '<p class="note">Left to itself the engine hands out query ports in start order '
      + '&mdash; 27016 to whichever server came up first, 27017 to the next &mdash; so '
      + 'restarting in a different order swaps them, and saved favourites and firewall '
      + 'rules follow the wrong server. dzsm writes this one into the generated '
      + '<code>serverDZ.active.cfg</code> at every start so it stays put.</p>'
    + '</div>';
}

function cfgPanel(name) {
  return '<div class="panel" data-form>'
    + '<h3>serverDZ.cfg &mdash; <span class="note">' + esc(cfgPath) + '</span></h3>'
    // The leading newline is deliberate: an HTML parser drops the first newline after a
    // textarea's open tag, so a file starting with a blank line would lose it.
    + '<textarea id="cfgtext" spellcheck="false">\n'
      + esc(cfgText === null ? '' : cfgText) + '</textarea>'
    + '<div class="field" style="margin-top:.6rem"><label>&nbsp;</label>'
      + '<button class="primary" data-act="saveCfg"' + attr('data-name', name) + '>Save</button>'
      + '<button data-act="editCfg"' + attr('data-name', name) + '>Cancel</button>'
      + '<span class="note">not validated &mdash; it is the engine\'s format, so anything '

}

// Livonia's terrain is "enoch", and picking the wrong one is a server that starts on the
// wrong world.
const TERRAIN_NAMES = {
  chernarusplus: 'Chernarus',
  enoch: 'Livonia',
  sakhal: 'Sakhal',
  chernarusplusgloom: 'Chernarus (Gloom)',
  namalsk: 'Namalsk',
  banov: 'Banov',
  deerisle: 'DeerIsle',
  takistanplus: 'Takistan',
  valning: 'Valning',
  esseker: 'Esseker',
  rostow: 'Rostow',
  pripyat: 'Pripyat',
};

function listContaining(instance, name) {
  if ((instance.mods || []).includes(name)) return 'mods';
  if ((instance.server_mods || []).includes(name)) return 'server_mods';
  if ((instance.keep_mods || []).includes(name)) return 'keep_mods';
  return null;
}

function instanceModRow(i, name, list, order) {
  const mod = last.mods.find(m => m.name === name) || {name: name, kind: '?'};
  const d = busy ? ' disabled' : '';
  const where = mod.kind === 'local'
    ? '<code>local</code> <span class="note">' + esc(mod.path || '') + '</span>'
    : steamLink(mod.workshop_id, '<code>' + esc(mod.workshop_id) + '</code>');
  const opt = v => '<option' + attr('value', v) + (v === list ? ' selected' : '') + '>'
    + LIST_LABELS[v] + '</option>';
  const dataset = attr('data-name', i.name) + attr('data-mod', name);
  return '<tr>'
    + '<td>' + (order == null ? '' : '<span class="note">' + order + '.</span> ')
      + steamLink(mod.workshop_id, esc(name))
    + '<td>' + where
    + '<td><select data-change="instSetList"' + dataset + d + '>'
      + opt('mods') + opt('server_mods') + opt('keep_mods') + '</select>'
    + '<td><button data-act="instLocalize"' + dataset + d + '>Local copy</button>'
      + '<button class="danger" data-act="instRemoveMod"' + dataset + d + '>Remove</button>'

}

function missionPanel(i) {
  const m = missions[i.name];
  if (m === undefined) return '<h2>Map</h2><div class="panel"><p class="note">Loading&hellip;</p></div>';

  const sources = m.available.filter(x => !x.seeded);
  if (!sources.length) {
    return '<h2>Map</h2><div class="panel"><p class="note">No missions found in this '
      + 'server\'s <code>mpmissions</code>. Download the server app first.</p></div>';
  }

  const current = pendingMission[i.name]
    || m.mission_source
    || (sources.find(x => m.resolved && x.terrain === m.resolved.split('.').pop()) || sources[0]).name;

  const option = x =>
    '<option' + attr('value', x.name) + (x.name === current ? ' selected' : '') + '>'
    + esc(x.name) + '  (' + esc(TERRAIN_NAMES[x.terrain] || x.terrain) + ')</option>';

  const changing = m.resolved
    && current.split('.').pop() !== m.resolved.split('.').pop();

  return '<h2>Map</h2><div class="panel" data-form>'
    + '<div class="field"><label>Seed from</label>'
      + '<select id="f-missionsource" data-change="previewMission"'
      + attr('data-name', i.name) + '>' + sources.map(option).join('') + '</select>'
      + '<span class="note">the vanilla mission this server\'s world is copied from</span>'
    + '</div>'
    // Derived from the *selected* source, not from m.resolved, so an unsaved pick shows
    // the name it would actually run as. Same expression previewMission uses, so a
    // repaint and a live preview never disagree.
    + '<div class="field"><label>Runs as</label><code id="missionname">'
      + esc(m.mission || m.prefix + '_' + i.name + '.' + current.split('.').pop())
      + '</code>'
      + '<span class="note">its own copy, yours to edit &mdash; '
      + (m.mission ? 'set explicitly' : 'derived from the map and instance name') + '</span>'
    + '</div>'
    + (changing
       ? '<div class="field"><label>&nbsp;</label><span class="warn">Changing the map '
         + 'seeds a new world.</span><span class="note">The current one stays on disk '
         + 'under its old name, so switching back keeps your economy and saves.</span></div>'
       : '')
    + '<div class="field"><label>&nbsp;</label>'
      + '<button class="primary" data-act="saveMission"' + attr('data-name', i.name)
      + (busy ? ' disabled' : '') + '>Save</button>'
      + '<span class="note">applies at the next start</span></div>'
    + '<p class="note">Mission folders hold <code>types.xml</code>, '
      + '<code>events.xml</code>, <code>init.c</code> and the persistence storage, which '
      + 'is why each server gets its own rather than sharing one.</p>'
    + '</div>';
}

function playersPanel(i) {
  const p = livePlayers[i.name];
  let body;
  if (p === undefined) {
    body = '<p class="note">Loading&hellip;</p>';
  } else if (!p.available) {
    // "Nobody connected" and "cannot ask" are different answers, and showing 0 for both
    // would be a lie.
    body = '<p class="note">' + esc(p.reason || 'unavailable') + '</p>';
  } else if (!p.players.length) {
    body = '<p class="note">Nobody connected.</p>';
  } else {
    body = '<table><tr><th>#<th>Name<th>Ping<th>Address<th></tr>'
      + p.players.map(s =>
          '<tr><td>' + s.number
          + '<td>' + esc(s.name)
          + '<td>' + s.ping + ' ms'
          + '<td><span class="note">' + esc(s.ip) + '</span>'
          + '<td>' + (s.lobby ? '<span class="warn">loading</span>' : '')
            + (s.verified ? '' : ' <span class="warn">unverified</span>')
          // The slot number, not the name: BattlEye addresses players by slot, and it
          // reuses them as people leave. These come from the list being displayed,
          // which the poll loop refreshes.
          + '<td><button data-act="kick"' + attr('data-name', i.name)
            + attr('data-number', s.number) + attr('data-player', s.name)
            + (busy ? ' disabled' : '') + '>Kick</button>'
            + '<button class="danger" data-act="ban"' + attr('data-name', i.name)
            + attr('data-number', s.number) + attr('data-player', s.name)
            + (busy ? ' disabled' : '') + '>Ban</button>'
          + '</tr>').join('')
      + '</table>';
  }

  const count = p && p.available ? ' (' + p.players.length + ')' : '';
  return '<h2>Players' + count + '</h2><div class="panel">' + body
    + '<p class="note">Live from RCON. Addresses are shown while someone is connected and '
    + 'never stored &mdash; the session history comes from the admin log instead.</p>'
    + '</div>';
}

function feedLine(e) {

      + '<span class="who">' + esc(e.name || '?') + '</span> '

function feedPanel(i) {
  const f = feeds[i.name];

  let body;

function instanceModsPanel(i) {

  // server-only and kept mods follow, where it does not matter.
  i.mods.forEach((n, idx) => { h += instanceModRow(i, n, 'mods', idx + 1); });
  i.server_mods.forEach(n => { h += instanceModRow(i, n, 'server_mods', null); });

  const available = last.mods.filter(m => !listContaining(i, m.name));

  h += '<div class="panel"><h3>Add a configured mod</h3><div class="field">'
    + '<label>Mod</label><select id="add-mod"' + (available.length ? '' : ' disabled') + '>'

    + '<select id="add-list"><option value="mods">loaded</option>'

    ? '<span class="run">running</span>'

  let h = '<div class="head"><h2>' + esc(i.name) + '</h2>' + state

    + ' &middot; query ' + i.steam_query_port

       ? '<button class="danger" data-act="stop"' + attr('data-name', i.name) + d + '>Stop</button>'

let hits = null;          // null = the browser has not been used yet
let hitsTotal = 0;
let hitsQuery = '';
let hitsPage = 1;
let hitsPages = 1;
let hitsSort = 'relevance';
let searchTimer = null;   // the pending as-you-type search
let searchSeq = 0;        // which search the newest response belongs to
let hitsTags = [];        // AND-ed, in the order of SEARCH_TAGS
let pendingQuery = '';    // survives a repaint, so a background refresh cannot eat it
let pendingChat = '';     // same, for the chat box

async function searchWorkshop(page) {
  // The query comes from the box on a new search, but from the last one when paging:
  // the box may have been typed into since, and page 2 must be page 2 of the results
  // actually on screen.
  const raw = page ? hitsQuery : val('q');
  // A category with no text is a browse, so an empty box is only a no-op when nothing
  // is ticked either.
  if (!raw && !hitsTags.length) return;
  hitsQuery = raw;
  hitsPage = page || 1;

  // A pasted link or a bare id is a lookup, not a search - and that path needs no API
  // key, so it works for people who never made one.
  const direct = raw.match(/^\s*(?:https?:\/\/\S*[?&]id=)?(\d{6,})\s*$/);
  const url = direct
    ? 'api/workshop/' + direct[1]
    : 'api/workshop/search?q=' + encodeURIComponent(raw) + '&page=' + hitsPage
      + '&sort=' + encodeURIComponent(hitsSort)
      + '&tags=' + encodeURIComponent(hitsTags.join(','));

  // Typing issues a search per pause, and the answers do not have to come back in
  // the order they were asked for: a slow "zom" landing after a fast "zombie" would
  // quietly replace the right results with older ones. Only the newest search may
  // write to the list.
  const seq = ++searchSeq;
  busy = true; painted = ''; render();
  try {
    const r = await fetch(url, {headers: headers()});
    const out = await r.json();
    if (seq !== searchSeq) return;
    if (!r.ok) { say(out.detail || 'search failed', true); hits = []; hitsPages = 1; }
    else if (direct) { hits = [out]; hitsTotal = 1; hitsPages = 1; }
    else { hits = out.items; hitsTotal = out.total; hitsPages = out.pages; }
  } catch (e) {
    if (seq !== searchSeq) return;
    say('search failed: ' + e, true); hits = []; hitsPages = 1;
  } finally {
    if (seq !== searchSeq) return;
    busy = false; painted = ''; render();
    // Paging redraws the list above the fold; without this the second page opens
    // scrolled to wherever the first one was being read.
    if (page) {
      const box = document.getElementById('q');
      if (box) box.scrollIntoView({block: 'center'});
    }
  }
}

// Long enough that typing a word is one search rather than six, short enough that it
// still feels like the page is keeping up. Every keystroke cancels the pending one.
const SEARCH_DEBOUNCE_MS = 450;

// Two characters match most of the Workshop, so the results are noise and the request
// is waste. The Search button still honours anything, for a deliberate short query.
const SEARCH_MIN_LENGTH = 3;

function scheduleSearch(text) {
  clearTimeout(searchTimer);
  const trimmed = text.trim();
  // Nothing to search and no category ticked: clear the list rather than leaving the
  // last results under an empty box, which reads as results for nothing.
  if (!trimmed && !hitsTags.length) {
    hits = null; hitsQuery = ''; painted = ''; render();
    return;
  }
  if (trimmed && trimmed.length < SEARCH_MIN_LENGTH) return;
  if (trimmed === hitsQuery) return;
  searchTimer = setTimeout(() => searchWorkshop(), SEARCH_DEBOUNCE_MS);
}

function pager() {
  if (hits === null || hitsPages <= 1) return '';
  const d = busy ? ' disabled' : '';
  const button = (page, label, on) =>
    '<button data-act="page"' + attr('data-page', page)
    + (on ? d : ' disabled') + '>' + label + '</button>';

  // A window around the current page, not every page: 50 pages of buttons is not a
  // navigation aid.
  const from = Math.max(1, Math.min(hitsPage - 2, hitsPages - 4));
  const to = Math.min(hitsPages, from + 4);
  let numbers = '';
  for (let p = from; p <= to; p++) {
    numbers += p === hitsPage
      ? '<button class="primary" disabled>' + p + '</button>'
      : button(p, p, true);
  }

  return '<div class="field" style="margin-top:.8rem">'
    + button(hitsPage - 1, '&larr; Prev', hitsPage > 1)
    + numbers
    + button(hitsPage + 1, 'Next &rarr;', hitsPage < hitsPages)
    + '<span class="note">page ' + hitsPage + ' of ' + hitsPages
    + ' &middot; ' + hitsTotal.toLocaleString() + ' matches</span></div>';
}

async function addMod(id) {
  const out = await send('POST', 'api/workshop/' + id + '/add',
                         {instances: ticked('.wtargets')}, 'Added mod ' + id);
  if (!out) return;
  // Mark it added rather than dropping the results: with paging, clearing them would
  // throw away the page being read and there is no way back to it but searching again.
  const hit = (hits || []).find(h => String(h.workshop_id) === String(id));
  if (hit) hit.configured_as = out.added;
  painted = ''; render();
}

function hitRow(h) {
  const img = steamLink(h.workshop_id, h.preview_url
    ? '<img' + attr('src', h.preview_url) + ' alt="" loading="lazy">'
    : '<img alt="">');
  const meta = [];
  if (h.subscriptions) meta.push(h.subscriptions.toLocaleString() + ' subscribers');
  if (h.file_size) meta.push(mib(h.file_size));
  if (h.time_updated) {
    meta.push('updated ' + new Date(h.time_updated * 1000).toISOString().slice(0, 10));
  }


  const action = h.configured_as
    ? '<span class="run">added as ' + esc(h.configured_as) + '</span>'
    : '<button class="primary" data-act="addWorkshop"' + attr('data-id', h.workshop_id)
      + (busy ? ' disabled' : '') + '>Add</button>';

  return '<div class="hit">' + img
    + '<div class="body">'
      + '<div class="title">' + steamLink(h.workshop_id, esc(h.title)) + '</div>'
      + '<div class="desc">' + esc(h.description) + '</div>'
      + '<div class="meta">'
        + meta.map(esc).join(' &middot; ')
        + (meta.length ? ' &middot; ' : '')
        + steamLink(h.workshop_id, 'id ' + esc(h.workshop_id))
      + '</div>'
    + '</div>'
    + '<div class="act">' + action + '</div>'

}

function targetBoxes(cls) {
  if (!last.instances.length) return '';
  return '<div class="field"><label>Add to</label><div class="targets ' + cls + '">'
    + last.instances.map(i =>
        '<label><input type="checkbox"' + attr('value', i.name) + '> ' + esc(i.name) + '</label>'
      ).join('')
    + '<span class="note">leave all unticked to add it to the config only</span>'
    + '</div></div>';
}

// Steam's orderings, by the names the API uses. "Best match" lets the search text
// decide the order; the rest ignore it, which is the right thing when the query is a
// category rather than a name.
const SEARCH_SORTS = [
  ['relevance', 'Best match'],
  ['subscribers', 'Most subscribed'],
  ['rating', 'Top rated'],
  ['updated', 'Recently updated'],
  ['newest', 'Newest'],
];

// DayZ's own Workshop categories, sampled from 800 live items. Not guessable: "Weapons"
// and "Buildings" are the obvious names and both match nothing. "Mod" is on every item,
// so it is not a filter, and the moderation states are not categories either.
const SEARCH_TAGS = ['Animation', 'Character', 'Economy', 'Environment', 'Equipment',
                     'Mechanics', 'Props', 'Server', 'Sound', 'Terrain', 'Vehicle',
                     'Weapon'];

function searchControls() {
  const option = ([value, label]) =>
    '<option' + attr('value', value) + (hitsSort === value ? ' selected' : '') + '>'
    + label + '</option>';
  const chip = tag =>
    '<label><input type="checkbox" data-change="tag"' + attr('value', tag)
    + (hitsTags.includes(tag) ? ' checked' : '') + '> ' + tag + '</label>';

  return '<div class="field"><label>Sort by</label>'
      + '<select id="sort" data-change="sort">' + SEARCH_SORTS.map(option).join('') + '</select>'
      + '<span class="note">the other orderings ignore how well the text matched, which '
      + 'is what you want when the query is a category</span></div>'
    + '<div class="field"><label>Categories</label><div class="stags">'
      + SEARCH_TAGS.map(chip).join('') + '</div></div>'
    + '<p class="note">Ticking a category with an empty box browses it: every Vehicle '
      + 'mod by Recently updated is how you find what was rebuilt for a new patch.</p>';
}

function workshopPanel() {
  let h = '<h2>Workshop</h2><div class="panel">'
    + '<div class="field">'
      + '<input type="text" id="q" data-enter="search"'
      + ' placeholder="Search, or paste a Workshop link or id"'
      + ' style="flex:1;min-width:18rem">'
      + '<button data-act="search"' + (busy ? ' disabled' : '') + '>Search</button>'
    + '</div>' + searchControls() + targetBoxes('wtargets');

  if (hits === null) {
    h += '<p class="note">Searching needs a Steam Web API key. Pasting a link or an id '
       + 'does not, so that works either way.</p>';
  } else if (!hits.length) {
    const what = [
      hitsQuery ? '&ldquo;' + esc(hitsQuery) + '&rdquo;' : '',
      hitsTags.length ? 'in ' + esc(hitsTags.join(' + ')) : '',
    ].filter(Boolean).join(' ');
    h += '<p class="note">nothing found for ' + (what || 'that') + '</p>';
  } else {
    h += hits.map(hitRow).join('') + pager();
  }
  return h + '</div>';
}

let localHits = null;
let localPath = '';

async function scanLocal() {
  const path = val('lp');
  if (!path) return;
  localPath = path;
  busy = true; painted = ''; render();
  try {
    const r = await fetch('api/localmods?path=' + encodeURIComponent(path), {headers: headers()});
    const out = await r.json();
    if (!r.ok) { say(out.detail || 'scan failed', true); localHits = []; }
    else { localHits = out.candidates; }
  } catch (e) {
    say('scan failed: ' + e, true); localHits = [];
  } finally {
    busy = false; painted = ''; render();
  }
}

async function addLocal(path) {
  // Its own checkboxes, not the Workshop panel's: ticking boxes in one panel must not
  // silently apply to an Add in the other.
  if (await send('POST', 'api/localmods/add', {path: path, instances: ticked('.ltargets')},
                 'Added local mod')) {
    localHits = null;
  }
}

function localRow(c) {
  const flags = [];
  if (!c.has_addons) flags.push('<span class="warn">no addons/</span>');
  if (c.has_keys) flags.push('has keys');
  const action = c.configured_as
    ? '<span class="run">added as ' + esc(c.configured_as) + '</span>'
    : '<button class="primary" data-act="addLocal"' + attr('data-path', c.path)
      + (busy ? ' disabled' : '') + '>Add</button>';
  return '<div class="hit">'
    + '<div class="body">'
      + '<div class="title">' + esc(c.name) + '</div>'
      + '<div class="meta">' + esc(c.path) + '</div>'
      + '<div class="meta">' + mib(c.size_bytes)
        + (flags.length ? ' &middot; ' + flags.join(' &middot; ') : '') + '</div>'
    + '</div>'
    + '<div class="act">' + action + '</div>'
  + '</div>';
}

function localPanel() {
  let h = '<h2>Already downloaded</h2><div class="panel">'
    + '<p class="note">Mods already on disk &mdash; a server\'s !Workshop folder, an old '
    + 'install, or one you built. dzsm points at them where they are: nothing is copied '
    + 'or downloaded, and steamcmd never touches them.</p>'
    + '<div class="field">'
      + '<input type="text" id="lp" data-enter="scan"'
      + ' placeholder="Folder to scan, or a single mod folder" style="flex:1;min-width:18rem">'
      + '<button data-act="scan"' + (busy ? ' disabled' : '') + '>Scan</button>'
    + '</div>' + targetBoxes('ltargets');

  if (localHits === null) {
    h += '<p class="note">Nothing scanned yet.</p>';
  } else if (!localHits.length) {
    h += '<p class="note">no mod folders found in ' + esc(localPath) + '</p>';
  } else {
    h += localHits.map(localRow).join('');
  }
  return h + '</div>';
}

function ago(iso) {
  if (!iso) return 'never';
  const seconds = (Date.now() - new Date(iso).getTime()) / 1000;
  if (seconds < 90) return 'just now';
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return minutes + ' min ago';
  const hours = Math.round(minutes / 60);
  return hours < 48 ? hours + 'h ago' : Math.round(hours / 24) + 'd ago';
}

function updateBanner() {
  const u = last.updates;
  if (!u) return '';
  const when = 'checked ' + ago(u.last_checked)
    + (u.interval_minutes ? ', every ' + u.interval_minutes + ' min' : ', automatic checks off')
    + (u.auto_download ? ', downloading automatically' : '');
  if (!u.available.length) {
    return '<p class="note">Everything up to date &mdash; ' + esc(when) + '.</p>';
  }
  return '<p><span class="warn">' + u.available.length + ' update'
    + (u.available.length === 1 ? '' : 's') + ' available</span>: '
    + esc(u.available.join(', '))
    + ' <span class="note">&mdash; ' + esc(when)
    + (u.auto_download ? '' : '; press Update mods to download')
    + '</span></p>';
}

function renderMods() {
  const d = busy ? ' disabled' : '';
  let h = '<div class="bar">'
    + '<button data-act="modsCheck"' + d + '>Check for mod updates</button>'
    + '<button data-act="modsUpdate"' + d + '>Update mods</button>'
    + '</div>' + updateBanner();

  h += '<h2>Configured mods</h2><table>'
    + '<tr><th>Name<th>Source<th>Cached<th>Used by<th></tr>'
    + last.mods.map(modRow).join('');
  if (!last.mods.length) h += '<tr><td colspan="5">none configured</tr>';
  h += '</table>';

  if (assigning && last.mods.some(m => m.name === assigning)) h += assignPanel(assigning);

  h += workshopPanel() + localPanel();

  h += '<h2>Cached versions</h2><table>'
    + '<tr><th>Mod<th>Version<th>Size<th>Age<th>Status</tr>'
    + last.versions.map(versionRow).join('');
  if (!last.versions.length) h += '<tr><td colspan="5">nothing cached</tr>';
  h += '</table>';
  return h;
}

// --- paint ---------------------------------------------------------------------

function renderJobs() {
  const running = jobs.filter(j => j.status === 'running');
  const recent = jobs.filter(j => j.status !== 'running').slice(0, 3);
  let h = '';
  for (const j of running) {
    h += '<div class="job"><span class="spin">&#9696;</span> ' + esc(j.kind)
       + ' running&hellip;</div>';
  }
  for (const j of recent) {
    const cls = j.status === 'succeeded' ? 'run' : 'err';
    const detail = j.detail ? ' &mdash; ' + esc(j.detail.split('\n')[0]) : '';
    h += '<div class="job"><span class="' + cls + '">' + esc(j.kind) + ' ' + j.status
       + '</span>' + detail + '</div>';
  }
  document.getElementById('jobs').innerHTML = h;
}

const FOOTERS = {
  overview: 'Refreshes every few seconds. Steam Guard is seeded once with '
          + '<code>dzsm login --interactive</code>.',
  server: 'Everything here applies at the server\'s next start &mdash; nothing is changed '
        + 'underneath a running server.',
  mods: 'Adding a mod configures it; downloading it is <b>Update mods</b>, and it is '
      + 'activated at each server\'s next start.',
};

function tokenPrompt(view) {
  if (!unauthorized) return '';
  // The box is on the overview, so from anywhere else this has to say where to go.
  return '<div class="panel"><h3 class="err">This server needs an API token</h3>'
    + '<p class="note">Some of what this page shows is refused without it &mdash; '
    + 'serverDZ.cfg and the manager settings carry passwords and the machine\'s layout. '
    + (view.page === 'overview'
       ? 'Paste it into the box below.'
       : 'Enter it on the <a href="#/">Overview</a>.')
    + ' It is the value of the environment variable named by <code>api.token_env</code>.'
    + '</p></div>';
}

function render() {
  const view = route();
  // Rebuilding #c destroys whatever has focus. For the chat box that would mean losing
  // focus and caret every poll while typing — which is precisely when someone is using
  // it — so where the focused element comes back with the same id, so does the caret.
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const caret = focusId && 'selectionStart' in active ? active.selectionStart : null;
  const caretEnd = focusId && 'selectionEnd' in active ? active.selectionEnd : null;

  document.getElementById('nav').innerHTML = navBar(view);
  document.getElementById('c').innerHTML = tokenPrompt(view) + (
      view.page === 'server' ? renderServer(view.name)
    : view.page === 'mods' ? renderMods()
    : renderOverview());
  document.getElementById('foot').innerHTML = FOOTERS[view.page];

  const box = document.getElementById('token');
  if (box) {
    box.value = token();
    box.addEventListener('change', e => {
      sessionStorage.setItem('dzsm-token', e.target.value);
      // Reload straight away rather than waiting out the poll: someone who has just
      // pasted a token wants to see it take effect.
      painted = ''; load();
    });
  }
  const qbox = document.getElementById('q');
  if (qbox) qbox.value = pendingQuery;
  const lbox = document.getElementById('lp');
  if (lbox) lbox.value = localPath;
  const cbox = document.getElementById('chat');
  if (cbox) cbox.value = pendingChat;
  // Pinned to the newest line. Without this a repaint drops the view back to the top of
  // the feed, which on a busy server means never seeing the message that just arrived.
  const feed = document.getElementById('feed');
  if (feed) feed.scrollTop = feed.scrollHeight;

  if (focusId) {
    const restored = document.getElementById(focusId);
    if (restored) {
      restored.focus();
      if (caret !== null && 'setSelectionRange' in restored) {
        try { restored.setSelectionRange(caret, caretEnd); } catch (e) { /* not a text field */ }
      }
    }
  }
  dirty = false;
  renderJobs();
}

let painted = '';

async function load() {
  try {
    // Every read goes out with the token, not just the ones that need it today: which
    // reads are gated is a server-side decision, and a page that only authenticates the
    // requests it thinks are protected breaks silently the moment that changes.
    //
    // A 401 yields null rather than throwing, so one gated route being refused leaves the
    // rest of the page working instead of replacing all of it with an error.
    let refused = false;
    const get = async path => {
      const r = await fetch(path, {headers: headers()});
      if (r.status === 401) { refused = true; return null; }
      return r.json();
    };
    const [inst, vers, srv, health, jl, mods, glob, upd, steam] = await Promise.all([
      get('api/instances'), get('api/versions'), get('api/server'), get('api/health'),
      get('api/jobs'), get('api/mods'), get('api/config/global'), get('api/updates'),
      get('api/steam'),
    ]);
    // Live players are fetched only for the server page being looked at, and no more
    // often than LIVE_PLAYERS_SECONDS. Every poll for every instance would mean a UDP
    // connect and RCON login per instance every four seconds, which is a lot of traffic
    // to learn a number that barely moves.
    const view = route();

    // Fetched once, and dropped after a server is added so the suggested port moves on.
    if (view.page === 'overview' && newServer === null) {
      const defaults = await get('api/instances/new');
      if (defaults) newServer = defaults;
    }

    if (view.page === 'server') {
      const instance = (inst || []).find(x => x.name === view.name);
      const last_fetch = livePlayersAt[view.name] || 0;
      if (instance && Date.now() - last_fetch > LIVE_PLAYERS_SECONDS * 1000) {
        livePlayersAt[view.name] = Date.now();
        livePlayers[view.name] =
          (await get('api/instances/' + encodeURIComponent(view.name) + '/players'))
          || {available: false, reason: 'needs an API token', players: []};
      }

      // Missions change only when a server build is downloaded or a map is saved, so
      // they are fetched once per instance and dropped from the cache on a save.
      if (missions[view.name] === undefined) {
        const list = await get('api/instances/' + encodeURIComponent(view.name) + '/missions');
        if (list) missions[view.name] = list;
      }

      // The feed is polled every pass, not throttled: it reads a buffer the session
      // thread already filled, so it costs no RCON traffic at all. On the first look at
      // an instance it also asks for stored history.
      const existing = feeds[view.name];
      const query = existing
        ? '?after=' + existing.cursor
        : '?history=' + FEED_HISTORY;
      const page = await get(
        'api/instances/' + encodeURIComponent(view.name) + '/feed' + query);
      if (page) {
        const kept = existing ? existing.events : [];
        feeds[view.name] = {
          live: page.live,
          reason: page.reason,
          cursor: page.cursor,
          // Trimmed, because this grows for as long as the page is open.
          events: kept.concat(page.events).slice(-FEED_LINES),
        };
      }
    }

    unauthorized = refused;
    last = {instances: inst || [], versions: vers || [], server: srv || {builds: []},
            mods: mods || [], global: glob, updates: upd, steam: steam};
    jobs = jl || [];
    document.getElementById('root').textContent = health ? health.root : '';
    // Where the comparison happens: the browser's certificate viewer shows the same
    // string, and a match is what proves this page came from the server and not from
    // something answering in its place. textContent, not innerHTML — it is data.
    const fp = document.getElementById('fingerprint');
    if (fp) {
      fp.textContent = health && health.tls_fingerprint
        ? 'certificate ' + health.tls_fingerprint : '';
    }

    // Only repaint when something actually changed. Rebuilding the DOM on a timer wipes
    // whatever is being typed and can swallow a click that lands mid-refresh.
    //
    // age_days is recomputed server-side on every request, so it is rounded to the
    // precision actually displayed — otherwise nothing ever compares equal and the page
    // repaints forever.
    // ago(last_checked) is included because it is what the banner shows: the timestamp
    // itself only changes when a check runs, so without this "5 min ago" would still say
    // that half an hour later.
    const snapshot = JSON.stringify(
      [last, jobs, busy, location.hash, cfgEditing, assigning, unauthorized, livePlayers,
       feeds, missions, newServer,
       ago(last.updates && last.updates.last_checked),
       ago(last.steam && last.steam.checked_at),
       // The restart countdown is rendered text, not data: the deadline itself does not
       // move, so without this "in 7 min" would sit there until something else changed.
       serverCountdowns()],
      (k, v) => (k === 'age_days' && typeof v === 'number' ? v.toFixed(1) : v));
    if (snapshot === painted) return;
    // Never repaint over unsaved edits, an open assignment panel, or a search box being
    // typed into.
    if (dirty || assigning) return;
    const focused = document.activeElement && document.activeElement.id;
    // 'chat' is not in this list on purpose: the feed has to keep updating while a
    // message is being typed, which is exactly when someone is watching it. Its text is
    // preserved through the repaint instead, via pendingChat.
    if (focused === 'token' || focused === 'q' || focused === 'lp') return;
    painted = snapshot;
    render();
  } catch (e) {
    document.getElementById('c').innerHTML =
      '<span class="err">failed to load: ' + esc(e) + '</span>';
  }
}

// The search boxes keep their text across repaints; they are not [data-form], because a
// half-typed query should not freeze the page's live updates the way an unsaved setting
// does.
document.addEventListener('input', e => {
  if (e.target.id === 'q') { pendingQuery = e.target.value; scheduleSearch(e.target.value); }
  if (e.target.id === 'lp') localPath = e.target.value;
  if (e.target.id === 'chat') pendingChat = e.target.value;
  if (e.target.id === 'cfgtext') cfgText = e.target.value;
  if (e.target.id === 'ns-name') pendingNewServer.name = e.target.value;
  if (e.target.id === 'ns-port') pendingNewServer.port = e.target.value;
});

render();
load();
setInterval(() => load(), 4000);
</script>
</body>
</html>
